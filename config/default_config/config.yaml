debug: false  # 调试日志：true=强制开启全链路 devLog（等价 agent.devLog.enable=true，记录工具入参/每轮 token/搜索词）；Web 配置中心「基础设置」也可改

agent:
  trigger: at
  triggerCommand: "#ai"
  commandPassThrough: true  # 指令透传（默认开）：以 # / ／ ＃ 等开头的 @/私聊消息若不是本插件的 AI 触发词，交给 Yunzai 与其它插件处理（如 #设置主人 / #重启 / #帮助）。关掉后这些消息会被当作 AI 提问（官方机器人没有 @ 也能收到全量消息时尤其需要保持开启）
  privateChat: false   # 私聊是否触发对话（默认关；false=私聊不响应，仅群内 @/命令触发）
  isolation:
    enable: true  # 多用户数据隔离（默认开）。true=每个群每个用户完全独立（会话/长期记忆/recall/群历史可见范围）；false=同群完全共享（群体型 bot，会话+记忆+群历史全群共用）。跨群始终隔离；私聊始终按用户。提醒/笔记/人设始终按用户。
  # ── 基础模型：引用下方「厂商配置 / 模型列表」的条目，不在此单独设置 ──
  providerId: ""      # 选中的厂商条目 id（Web 配置中心 → 厂商配置；运行时由此解析 protocol/preset/baseURL/apiKey）
  modelId: ""         # 选中的模型条目 id（模型列表；须属于上面 providerId 指向的厂商）
  # ↓ 以下 5 项是上面引用的解析结果（只读镜像，每次加载自动回填，勿手改；
  #   它们是给老兼容读点用的快照，改厂商 Key / 改模型都会自动跟随）
  protocol: openai  # openai | anthropic | gemini（gemini=原生官方 @google/genai SDK + Interactions API，填 apiKey 即用，无需 baseURL/preset）
  preset: deepseek  # 厂商预设（openai/deepseek/gemini/dashscope/zhipu/moonshot/mimo/minimax/doubao/anthropic/openrouter/opencode=按量 /opencode-go=月付订阅$5起 /commandcode=OpenAI+Anthropic 双兼容网关）；gemini 原生协议时仅占位
  baseURL: ""
  apiKey: ""               # 解析镜像（勿手改）：由上面 providerId 指向的「厂商配置」条目的 apiKey 自动回填；留空则插件不初始化
  model: "deepseek-chat"
  utilityModel: ""  # 旁路小模型（播报等）：填模型条目 id 或模型名，可来自任意厂商（运行时按注册表解析端点）；留空=沿用主模型

  # ── 厂商/模型注册表（web 配置中心 → 厂商配置 / 模型列表 两区维护；运行时经上面 providerId/modelId 引用）──
  llmProviders: []  # [{ id, name, protocol, preset, baseURL, apiKey }] LLM 服务商端点（「厂商配置」区维护）
  llmModels: []     # [{ id, name, providerId, model, temperature, maxTokens, note }] 模型条目（挂在某厂商下，「模型列表」区维护）
  # 回退模型：主模型失败时依次尝试。**唯一真源**=本数组，每条独立 baseURL/apiKey/protocol（可跨厂商）。
  # 旧版扁平字段（fallbackModel/fallbackBaseURL/fallbackApiKey/fallbackProtocol）已废弃：
  # 启动时自动迁移进本数组并删除扁平键；面板（Web/锅巴）都只编辑数组。
  # 例：主 DeepSeek，回退 GPT → [{ model: "gpt-4o", baseURL: "https://api.openai.com/v1", apiKey: "sk-gpt-xxx", protocol: "openai" }]
  fallbackModels: []
  proxy: ""  # HTTP(S) 代理（如 http://127.0.0.1:7890）；国内服务器访问 GPT/Gemini 等海外 LLM 用，留空=直连。SOCKS 暂不支持（socks5:// 会被忽略并直连）
  reasoningFields: []
  maxTurns: 200  # 单次对话工具调用轮次预算上限（默认 200；配合下方 loop.* 智能终止，实际很少触顶）
  loop:                       # 循环智能终止（审计 §2.1）：独立于 maxTurns 硬上限，额外检测死循环/停滞/预算耗尽
    maxSameAction: 2          # 同工具+相同参数连续允许次数（超出 → duplicate_action 终止，防 ping 死循环）
    maxConsecutiveFailures: 3 # 连续工具失败次数上限（超出 → consecutive_failures 终止）
    noProgressWindow: 4       # 连续 N 步无新事实 → no_progress 终止
    timeBudgetMs: 3600000      # 单次对话工作时间预算（毫秒，超出终止在途调用并进入收尾；60 分钟，与 multiagent.workerTimeBudgetMs 对齐）
    tokenBudget: 480000       # 单次对话累计「有效工作 token」上限：未命中输入 + 缓存写 + 输出；缓存命中读按 0.1x 折算。
                             # （与真实成本对齐：长上下文整段被缓存时按全价计会几轮就误杀长任务）
                             # 语义：调模型前按「已用有效 token + 最近一轮有效增量」预检，不再启动注定超支的一轮；
                             # 收尾总结调用独立预留（不占本预算）。
    finalizeGraceMs: 45000   # 收尾宽限：预算/时间耗尽后，收尾总结调用可用的独立时间窗（只受用户取消约束）
  temperature: 0.2  # 工具调用稳定性（建议 0.1~0.3；勿设 0 避免复读式回复）
  thinking:                # 手动思考（provider 原生形状，留空=不手动开启）：如 { type: "enabled", budget_tokens: 16000 }；布尔/字符串会被原样下发导致协议错误
  thinkingAuto:            # 思考自动决策（opt-in）：按提问复杂度自动决定是否思考与深度；开启后覆盖上面的手动 thinking（模型级 thinking 覆盖仍优先）
                           # 能力自适应：能力表未明确表态的（新）型号默认乐观启用；厂商拒绝思考字段时自动剥离重试并记忆（之后自动转不支持，无需重启）
    enable: false          # 打开后 Agent 每轮判定：闲聊/简单问题不思考，复杂问题按深度思考
    classifier: auto       # 判档方式：auto=规则不确定时用小模型判（省调用）/ always=总是小模型 / off=纯规则 / jev=由 Jev 判档（需开启 Jev）
    model: ""              # 判档小模型（留空=utilityModel→主模型；建议廉价小模型）
    timeoutMs: 2500        # 小模型判档超时（超时/失败自动回退规则，不阻塞对话）
    maxBudget: 32768       # 自动思考预算硬顶（tokens；防单轮烧太多）
    budgets:               # 各深度预算（tokens；质量优先，取值偏宽松）
      low: 4096
      medium: 8192
      high: 16384
    style: ""              # 传输风格覆盖（留空=按厂商预设自动；如 reasoning_effort / thinking_toggle / enable_thinking / deepseek / minimax / anthropic_budget / gemini_level）
  # ── Jev（TypeSafe AI 判断模型，opt-in，默认关）──
  # ⚠️ 安全警告：启用后会把**用户对话内容 / shell 命令**发往第三方 TypeSafe（typesafe.ai）做结构化判断，
  #    属新增数据外发面。默认关闭；仅在明确知晓并接受该风险时开启。所有决策点失败/低置信一律无感回退
  #    现有方案（思考→规则+小模型；工具→tool_search；reflect→auto；shell→现有行为），不阻塞对话、不 500。
  #    Jev 现在作为「厂商 + 模型」注册（厂商配置里选 jev 预设；模型列表挂 jev 模型），在「基础 / 模型」卡片
  #    打开 Jev 开关并选择厂商/模型；问题/阈值/模型 ID 集中在 model/agent/jev/spec.js 一起版本化。
  jev:
    enable: false          # 总开关（opt-in；关闭时下列 decisions 全部不生效，零影响）
    providerId: ""         # Jev 厂商引用（「厂商配置」中 preset=jev 或 openrouter 的条目）
    modelId: ""            # Jev 模型引用（「模型列表」中该厂商下的模型条目）
    model: ""              # 手填模型 ID（留空=用 modelId 指向的注册模型；可直接填 jev-latest / jev-1.13.0）
    timeoutMs: 4000        # 单请求超时（毫秒；超时/失败自动回退。Jev 典型延迟 ~100-300ms，4s 已很宽松）
    maxRetries: 1          # 408/429/5xx 重试次数（401/422 不重试；遵守 Retry-After）。连续失败 3 次熔断 30s
    maxStateChars: 32000   # LLM jev 工具单次 state 字符上限（防上下文/计费失控）
    toolSelectionMaxTools: 80  # 工具选择最多发给 Jev 的候选工具数（64k 上下文保护）
    decisions:             # 各决策点是否走 Jev（多数由对应卡片的选择器派生；见 apps/agent.js）
      llmTool: false       # 注册 jev 工具供主 LLM 主动调用（把 state+questions 发给 Jev 取结构化答案）
      terminalRisk: false  # shell 命令执行前用 Jev 判定风险（破坏性默认拒绝；回退：现有行为）
    allowDestructive: false  # shell 风险：是否允许"高置信破坏性"命令执行。false=破坏性一律拒绝（fail-closed，推荐）；
                             # true=仅当 Jev 置信度 ≥ thresholds.terminalRiskFloor 才放行（终端无审批，请谨慎）
    thresholds:            # 置信度门控阈值（集中可配；按"答错的代价"校准）
      lowConfidence: 0.5       # 通用低置信边界（低→回退）
      highConfidence: 0.9      # 通用高置信边界（高→才允许破坏性动作）
      thinkingMinConfidence: 0.5  # 思考档位低于此值回退规则判档
      toolNoulFloor: 0.6       # 工具 noul 概率达此值才激活
      terminalRiskFloor: 0.75  # 破坏性命令需达此置信度才允许执行（allowDestructive=true 时）
      reflectFloor: 0.5        # reflect noul 概率达此值才触发反思
  # shell 安全：自定义拦截指令（在 terminal 执行前做确定性拦截，与 Jev 是否开启无关）
  shell:
    intercept: []          # 需拦截的指令片段列表（大小写不敏感子串匹配；命中即拒绝执行，如 "rm -rf /"）
  maxTokens:              # 单次回复最大 token（留空=厂商默认；Anthropic 默认 4096）
  contextWindow:          # 模型上下文窗口 token 数（如 200000），按**估算 token** 计数：中文/日文/韩文≈1 token/字，其余≈1 token/4 字符（v1.26.6 起）。
  # 配置后启用 token 高低水位压缩（超 contextHighRatio 压到 contextLowRatio、保留首条意图、cacheEpoch 分代），未配置按消息条数水位（30→18）压缩。
  # 请填模型**真实**窗口：填太小会频繁压缩（每次压缩都要重建前缀，命中率下降），填太大可能顶穿上游窗口。
                          # 缓存经济性：稳态 token 命中率 ≈ 1 − 2·d·H/(H²−K²)（d=每轮新增、H=高水位、K=压后目标），同一窗口下「压得深」比「勤压」命中率高得多；压缩无损（原文归档，context_recall 可恢复）
  contextMsgHighWater: 30    # 未配置 contextWindow 时的消息条数高水位（达到即压缩）
  contextMsgLowWater: 18     # 消息条数低水位（压缩后保留条数）
  contextHighRatio: 0.65  # token 压缩高水位比例（占 contextWindow；0.3~0.95；仅配置 contextWindow 后生效）。想提高缓存命中率可上调（如 0.8），代价是单次请求更长
  contextLowRatio: 0.45   # token 压缩压后目标比例（占 contextWindow；须小于高水位）。压得更深（如 0.15）能让「新增→再压」的周期更长，命中率更高（无损压缩，历史可用 context_recall 恢复）
  compaction:               # 无损上下文压缩（Hermes 四阶段可逆化）：被移出窗口的原文整块归档（sha256 校验），
    enable: true            # 窗口内留结构化台账 + context_recall 工具按 ref/关键词恢复；false 关闭归档与恢复工具（回滚杠杆）
    archiveDir: "data/context-archive"  # 压缩原文归档目录（按会话分目录，独立于会话数据生命周期）
  maxToolResultChars: 8000  # 单条工具结果字符上限（内容获取类工具可经 meta.resultCap 单独放宽到 12000）
  toolConcurrency:          # 单批工具调用的受控并发（审计 §F03）：未声明并发语义的工具默认独占，内置只读工具显式并发
    maxParallel: 3          # 全局滚动并发池上限（同一批只读工具最多同时执行多少个；独占/资源类工具另行串行）
  toolSchemaValidate: true  # 工具参数 schema 预校验（缺参/类型错误/多余参数在副作用前结构化回报；关=回滚杠杆）
  taskStore:                # 可恢复任务账本（P0-3）：任务事件/检查点落 sqlite 事务；重启把未结算任务标 interrupted
    enable: false           # 默认关闭（开发阶段开关；开启后写入任务库，写操作默认不自动重放）
    dir: "data/tasks"       # 任务库目录
  keepReasoning: false      # 是否把推理(reasoning_content)回灌历史（默认 false 省 context；thinking 模式带工具调用的轮次按协议必需始终回传，不受此开关影响）
  stream: false             # 逐字流式输出（依赖适配器、不稳，默认关）
  reflect: auto             # 自我反思/自纠：off=关 | auto=仅多轮/用工具时(默认) | always=每次最终回复都反思 | jev=由 Jev 判断是否需要反思
  finalizeMaxTokens: 2048   # 收尾（finalizer）输出 token 上限：异常停止后最后一次交付；太小会截断总结/子代理报告
  rootTokenBudget: 0        # F13 根任务 token 预算上限（0=不限）：主/编排/子代理/反思合计；嵌套工作开始前预留
  render:                   # 卡片图渲染（帮助/聊天列表/人设列表；回复图由 reply.mode 控制）
    card: true              # 帮助/列表卡片图开关；弱服务器可置 false 直接回文本，避免渲染卡死
    timeoutMs: 15000        # 单张卡片图（列表类）渲染总超时（毫秒）：超时/失败降级文本，不让指令永久卡住
    helpTimeoutMs: 300000   # 帮助图渲染总超时（毫秒，默认 5 分钟）：帮助卡片最长、弱机器/冷缓存首次渲染常超过 15s；超时降级文本并进入冷却
    replyTimeoutMs: 30000   # 回复图渲染总超时（毫秒）
  cacheControl: "off"      # Anthropic 协议显式 prompt 缓存断点三态：off | auto（官方端点自动开）| explicit（强制）；OpenAI 兼容端自动前缀缓存无需开
  promptCacheKey: false    # OpenAI 官方 prompt_cache_key 稳定会话路由（仅 OpenAI 官方端点/支持该能力的模型下发，兼容网关绝不发）
  reflectMaxIterations: 1   # 反思回环修正最大次数（封顶防无限循环）
  progress: true            # 工具调用时推送节流进度消息（消除干等，默认开）
  progressRecall: 3         # 进度消息多少秒后自动撤回（默认 3；适配器不支持则忽略）
  reply:
    mode: image             # 回复渲染：image（markdown→精美浅色图片，默认）/ text（纯文本）；渲染失败自动退文本
    atSender: true          # 群聊回复时艾特发言人（私聊不艾特）
    quote: true             # 群聊回复时引用触发消息（私聊不引用）；人多时便于定位回复对象，可与 atSender 同开
    narrate: true           # 中途播报：模型调工具时附带的思路/进展文本自动转发给用户（OpenClaw 式）
    renderScale: 3          # 回复图片渲染倍率（deviceScaleFactor，3=超清默认；2=高清；1=普通；越大越清晰但越耗内存/体积）
  # ── QQ 官方机器人：本插件自实现适配器（AppID + AppSecret 直连）──
  # 目的：TRSS 官方 QQBot 适配器（Yunzai-QQBot-Plugin）仍要求「机器人QQ号:AppID:Token:AppSecret」
  # 四段连接串（Token 是 QQ 频道 v1 时代遗留）；现行开放平台只需 AppID + AppSecret 换 access_token。
  # 本适配器直接实现网关 + v2 REST，并原生支持 Markdown 消息与 inline keyboard。
  # ⚠️ 与 Yunzai-QQBot-Plugin 二选一：同一条机器人同时连两个适配器会重复收发。
  # 启用后可用 #qqbot状态 / #qqbot重连 / #qqbot账号 查看与重连。
  qqBot:
    enable: false              # 总开关（关=不注册适配器、不连接）
    appId: ""                  # 机器人 AppID（QQ 开放平台 → 开发设置）
    appSecret: ""              # 机器人 AppSecret（★敏感：回复发送前会脱敏）
    accounts: []               # 多账号：[{ name, appId, appSecret, sandbox, intents, markdown }]（与上面扁平字段二选一）
    intents: 0                 # 事件订阅位图（0=默认只订「群@消息 + 私聊C2C」= 33554432）。按钮交互=100663296；频道=1073741825。
                               # 填了平台未开通的位会被拒绝连接（close 4013 invalid intents / 4914）——本插件会自动降级重连，但仍建议只填已开通的。
    markdown: auto             # auto=先试 Markdown、无权限自动降级纯文本并记忆 | true=总是 | false=纯文本
    preferMarkdownText: false  # true=纯文本回复也走 Markdown 消息（平台支持时更美观）
    sandbox: false             # true=连沙箱环境（api 域名 sandbox.）
    apiBase: ""                # 覆盖 OpenAPI 基址（默认 https://api.bot.qq.com；网络/404 失败自动回退 api.sgroup.qq.com；自建代理时填）
    tokenUrl: ""               # 覆盖 access_token 端点（默认 https://api.bot.qq.com/app/getAppAccessToken；失败自动回退 bots.qq.com）

  # ── QQ 官方机器人（QQBot / QQ 频道适配器）──
  # 官方协议与 OneBot 不同：消息 ID 是 openid（<self_id>:<openid> / qg_...）而不是 QQ 号/群号，
  # 且支持原生 Markdown 消息与 inline keyboard 按钮。发 /uid、/groupid 可打印可直接粘贴的原始 ID。
  qqOfficial:
    markdown:
      enable: true             # true=官方机器人回复直发 Markdown（不再渲染成图片）；平台拒绝时自动降级纯文本
      maxChars: 3500           # 单条 markdown 内容上限（超出按行分片；官方上限约 4000）
      templateId: ""           # 官方 Markdown 模板 ID（后台申请后填；填了走模板消息，忽略正文的直接渲染）
    keyboard:
      enable: true             # true=注册 send_keyboard 工具（Markdown 卡片 + 按钮，仅官方协议可用）
    progress: false            # 官方机器人默认不发"思考中…"等进度消息（主动推送有频控/需权限）；需要时置 true
    narrate: false             # 中途播报同上（默认关，避免被动回复窗口内多条消息被拒）
  memoryLimits:             # 声明式记忆字符上限 {memory:2200,user:1375}；留空=默认
  memory:
    enable: true            # 声明式记忆总开关（关则不注入 MEMORY.md/USER.md）
    threatScan: true        # 写长期记忆前扫描指令注入（命中降置信+标 suspect，召回屏蔽，#记忆 仍可见原文）
  recall:
    cap: 200                # 每用户长期记忆条数上限（超限按价值淘汰，非 FIFO）
    extractEvery: 10        # 每 N 轮触发一次 LLM 抽取（意图词"记住/叫我"等仍即时触发）
    minScore: 0             # 召回最低综合分阈值（0=仅过滤零相关；配 embedding 后可调大如 0.3）
    diversity:              # 去冗余：候选多于 topK 时按 MMR 兼顾相关与多样
      enable: true
      lambda: 0.7           # 1=纯相关排序；越小越鼓励多样（建议 0.5~0.8）
      perTypeCap: 3         # 同一 type 最多入选条数（选不满 topK 时自动放宽）
    usage:                  # 使用反馈：反复注入却从未被引用的记忆轻微降权
      enable: true
      containment: 0.5      # 最终回复对记忆词元的包含率 ≥ 此值判为"被引用"
      penalizeAfter: 5      # 注入达此次数且从未被引用 → 降权
      penalty: 0.5          # 降权系数（0.5=权重减半）
    model: ""               # 抽取用模型 id（留空=utilityModel→主模型；可跨厂商）
    embedProvider: ""       # 语义召回 embedding 模型 id（留空=关键词 jaccard；填则走 cosine 语义匹配）
    embedBaseURL: ""        # embedding 接口地址（留空=复用主 baseURL；用专门 embedding 服务时填，如 https://api.openai.com/v1）
    embedApiKey: ""         # embedding apiKey（留空=复用主 apiKey）
  profile:                  # 统一用户画像：结构化、带证据、可纠错、会演进的跨会话用户模型
    enable: true            # 总开关（关则不注入且不采集；#清空所有记录 会一并清除）
    maxChars: 600           # 注入 system 动态块的字符上限
    maxPerFacet: 8          # 每分面（身份/偏好/沟通风格…）最多保留条数，低置信先淘汰
    infer: true             # 从消息统计隐式推断沟通风格（长度/表情/提问率/活跃时段，标"（推断）"）
    inferAfter: 8           # 累计消息数达到此值后才开始隐式推断（防样本不足误判）
  kb:
    enable: true            # 知识库总开关（关则不注册 kb_search、不入库）
    crawlEnable: true       # 网页抓取开关（web_crawl 工具 + URL 入库/刷新；关则不注册 web_crawl）
    crawl:
      engine: crawl4ai      # 网页抓取引擎：crawl4ai（默认。真浏览器渲染，SPA/JS 动态页可抓；
                            # 需先跑 scripts/install-crawl4ai.sh，未安装自动降级 fetch）| fetch（纯 HTTP+cheerio，零依赖）
      execution: local      # 抓取执行面：local（默认）=宿主 venv crawl4ai（本地引擎，与 sandbox.mode 无关，
                            # 同 diagram 的本机 Kroki）| sandbox=显式改在会话沙箱内跑（需 agent.sandbox.mode=e2b
                            # 且模板预装 crawl4ai；沙箱未就绪即降级纯 HTTP fetch，不改跑宿主 crawl4ai）
      stealth: true         # 浏览器路径反检测（playwright-stealth + 模拟用户行为）；显式传 stealth:false 可单次关闭
      retryBlocked: true    # 被反爬拦截（403/CF 挑战等）时自动用 undetected+stealth 强化再试一轮（最坏耗时翻倍）
      allowPrivateHosts: false  # 允许抓取本机/内网/元数据地址（防 SSRF，默认禁）；确需抓内网页面再开
      # proxy 复用 agent.proxy（浏览器路径与 fetch 一致；逐次生效）
      sessionPersist: true  # 按站点持久化 cookie（含 cf_clearance 等清关凭证，按下面 sessionTtlHours 复用，默认 12h）：抓取不再是「每次都是新访客」；
                            # 存于 data/crawl/sessions.json（0600，cookie 值不进日志，可在该目录删除）
      sessionTtlHours: 12   # 会话有效期（小时）：超期视为过期，避免拿早已失效的凭证反复重试
      sessionProfile: false # 是否另用持久浏览器 profile（user_data_dir，落 data/crawl/profile）。
                            # 默认关：共享 profile 目录无法并发打开浏览器（ProcessSingleton 锁），开了会全局串行、
                            # 且 profile 里的历史 cookie 不受 sessionTtlHours 约束（想彻底隔离就别开）
      siteMemory: true      # 站点难度记忆：记住「哪个档位真的能过」——上次 fetch 够用就不再起浏览器；
                            # 上次被反爬拦过就直接用 undetected，少打注定被拦的请求（存于 data/crawl/sites.json）
      perHostIntervalMs: 1200  # 同站点两次抓取的最小间隔毫秒（含随机抖动）：请求节奏比单次快慢更容易触发风控
      hostConcurrency: 1    # 同站点并发抓取上限（1=串行；多页并发抓取同一站会显著提高被拦概率）
    crawlTimeout: 60        # 单页抓取超时秒（慢站可调大；crawl4ai 含浏览器启停另加 30s 余量）
    chunkSize: 500          # 文档分块字符数
    chunkOverlap: 50        # 分块重叠（保上下文连贯）
    topK: 5                 # kb_search 默认返回片段数
    minScore: 0.3           # 最低相似度（cosine；低于不返回）；embedding 复用上面的 recall.embedProvider
  schedule:
    taskEnabled: true       # 定时任务链总开关（#定时任务 cron 重复 task；false 则拒绝创建）。注意：提醒按用户归属，定时任务链按会话（群级）归属
    taskMaxTurns: 200        # 任务链工具调用轮次上限（防失控烧 token；200=给足步数，靠 loop.* 智能终止兜底）
  selfReview:
    enable: true            # 在线自进化：每 N 轮对话后台异步自我评审，产出改进 suggestion（不阻塞回复）
    every: 20               # 每 N 轮对话触发一次后台自评审（per-scope 计数）
    model: ""               # 评审用模型 id（留空=utilityModel→主模型；建议用廉价小模型降本；可跨厂商）
    autoApplyMemory: true   # 记忆类 suggestion 自动应用（有 prev[] 回滚 + 威胁扫描 + 置信度闸兜底）
    autoApplyPrompt: false  # prompt/技能类落盘待审（#审阅进化 人工把关；强烈建议保持 false）
    dailyBudgetTokens: 200000  # 自评审日 token 预算（耗尽则只采迹不评审）；0=关闭后台自评审
  evolution:
    traceDir: "data/evolution/traces"           # 对话轨迹存储（供离线 GEPA + 在线自评审消费）
    promptDir: "data/evolution/prompts"         # 进化产出的 prompt 覆盖（加载时覆盖内置 TEMPLATES）
    suggestionDir: "data/evolution/suggestions"  # 自评审 suggestion 落盘（按 scope 隔离）
  toolEvo:                                       # Tool Evolution（工具进化）：可验证/可回滚/权限不可自扩的工具生命周期
    enable: true                                  # 总开关（关闭则不初始化 DB、不埋点、不注入进化工具）
    dbPath: "data/evolution/tevo.db"              # sqlite 库（工具/版本/调用/审计）
    artifactsDir: "data/evolution/tools"          # 工具制品（TOOL.md/index.js/manifest.json/tests.json）
    maxRepairAttempts: 2                          # 候选生成失败自动修复上限（文档 §13）
    runnerTimeoutMs: 5000                         # stable 工具单次调用超时（本地 fork 档与沙箱档共用）
  systemPrompt:
    # 默认身份 system prompt。优先级：人设覆盖 > 进化产出的 agent 提示词 > 本项 > 内置默认身份。
    # （留空＝用内置默认；v1.26.30 修：此前注册表里预置的内置模板被误当「进化产出」，本项写了不生效）
  chatPermission: master
  masterSkipConfirm: false   # 主人发起的任务免确认直执行（高危！仅主人；denylist 仍拦）。开启后主人命令不再 #确认，但会发高危提示
  masters: []                # 主人/审批通知 ID：QQ 号，或 QQ 官方机器人 openid（/uid 的完整 user_id 或去前缀值，如 807AC...）
  confirmTimeout: 300        # 审批超时（秒）；超时自动拒绝
  guardAction: flag
  guardSensitivity: medium
  untrustedGuard: true         # 间接注入防御：工具结果/网页/MCP/记忆/情境等外部内容命中注入特征时加 <untrusted_data> 边界标注（默认开）
  redactSecrets: true          # 发送前脱敏：屏蔽回复中的 API Key/token 等敏感信息（默认开）
  persona:                     # 人设配置（全局默认人选 + 落盘注入检测）
    defaultId: ""              # 全局默认人设 id（未单独 #人设 切换的用户生效；留空=用 systemPrompt/内置默认身份）
    skipInjectionCheck: false  # ⚠️ 高危：跳过「疑似越狱/提示注入」检测（默认关）。开启后人设内容原样进入 system 身份层，仅用于完全信任的自建角色卡
    styleExamples: []          # 可选：沟通风格示例（注入人设用；供伪人/主 Agent 参考语感）
  personaLore:                 # 人设资料库（长尾知识/补齐资料；目录可自定义）
    dir: ""                    # 资料库目录（留空=data/persona-lore）
    adoptionsDir: ""           # 采纳队列目录（留空=data/persona-adoptions）
  devLog:
    enable: true             # 生产环境默认开：记录 AI 全链路(缩进 JSON 人工可读)，方便 #上报错误 排查
    dir: ""                  # 日志目录(留空=默认 <插件>/data/logs)
  policy:
    categoryMin:            # 覆盖内置类别最低角色，如 { message: 1, mcp_write: 2 }；留空=用内置阶梯（query:0/personal:0/message:1/group_manage:2/system:3）
  media:
    enable: true               # 多模态总开关：false=同时关闭附件收集/视觉子模型/表情自动发现/工具看图
    active: true
    passive: true
    maxImages: 4
    maxFileBytes: 8388608
    degrade: note             # 非视觉模型降级：skip（丢弃）| note（占位说明，默认）| text（文本类提取；其它值按 note 处理）
    capsFromApi: true           # 从厂商 /models 拉取模态元数据判定模型能力（OpenRouter 等暴露模态的厂商；MiMo 无此数据→回退内置表）
    caps:                       # 能力覆盖（可选）：vision/file/audio/video/tools/thinking 等；留空按协议+模型名自动判定。
                                # 原生音频块(OpenAI input_audio/Gemini audio)需 audio:true；视频识别需 video:true（mimo v2.5/v2.6 已内置）
  vision:
    enable: true
    model: ""               # 视觉子模型（识图 + 看视频）：留空=主模型支持视觉时复用主模型；主模型纯文本时必须显式指定
                            # 若该模型已在「模型列表」注册，自动复用其厂商连接；下列连接字段留空即启用自动路由
    protocol:
    preset:
    baseURL: ""
    apiKey: ""
    maxTokens: 1024        # 识图/观看报告输出上限（视频报告建议 2048+；思考型模型建议关思考）
    describePrompt: ""      # 识图自定义指令（留空=内置；不影响视频——视频用内置“看视频”报告指令或工具自带 watchPrompt）
  perception:
    sparseInject: true      # 会话上下文稀薄（新会话/历史很少）时，额外注入一小段近期群聊，避免模型对群内近况一无所知
    sparseThreshold: 6      # 触发上述补全的会话历史条数阈值（会话历史 < 该值才补）
  tools:
    builtin: true
    dir: "tools"
  toolDiscovery:
    enable: true              # 工具按需发现（默认开）：控制 system 工具速查与 tool_search/activeTools 记录；注意 stableList=true 时 tools schema 仍全量下发（见下）
    method: llm               # 工具选择方法：llm=主 LLM 经 tool_search 自主发现（默认）/ jev=由 Jev 从全量工具目录选择（需开启 Jev）
    alwaysOn: []              # 常驻核心工具（不经过搜索，写入 system 工具速查）；空数组/留空=用内置默认（model/agent/Agent.js DEFAULT_ALWAYS_ON，含 context_recall/schedule_task/kb_search/reminder_set 等 13 项）
    topK: 8                   # tool_search 默认返回数
    minScore: 0.3             # 最低相似度（query 覆盖率/cosine；0.3=至少 30% 命中，平衡召回与精度）。注意 stableList=true 时工具 schema 仍全量下发，tool_search 只影响目录/记录
    stableList: true          # ★工具数组跨轮恒定（缓存关键，默认开）：实测 tools 数组哪怕只追加一个工具，整段 prompt 前缀缓存立即归零（命中率 97.6%→0%）。开=每轮下发全量工具定义（首轮多付约 1 万 token，之后全部命中）；false=旧的追加式增长
  miyoushe:
    cookie: ""
    defaultGid: 2
    maxImages: 9              # miyoushe_post 单帖最多主动发图数（攻略图集帖，避免只发一张；默认 9）
  comfyui:
    enable: false             # ComfyUI 工具总开关（关则不注册 comfyui__* 工具，零影响）
    host: "http://127.0.0.1:8188"   # ComfyUI 服务地址（本地/远程/Cloud）；本地默认 8188
    cloud: false              # true=走 Comfy Cloud 路由（host 填 https://cloud.comfy.org，端点加 /api 前缀、/history→/history_v2、/view 跟 302）
    apiKey: ""                # Cloud 的 X-API-Key（cloud:true 时必填；本地通常留空，反向代理加鉴权时填）
    workflowDir: "workflows"  # 自动发现工作流的目录（ComfyUI user 目录下；默认 user/default/workflows，递归含子目录）
    workflowCacheTtl: 300     # 工作流发现/转换缓存秒数（刚在 ComfyUI 里保存新工作流可让工具带 refresh 刷新）
    confirm: true             # 生成需主人审批（#确认/#拒绝）；false=免审批直接生成（每次生成消耗 GPU，谨慎关闭）
    command:                  # 指令画图（#画图列表 / #画图1 关键字；免 LLM 的快捷入口）
      enable: true            # 关=不响应 #画图 指令（交给其它插件/LLM）；仅在 comfyui.enable=true 时有效
      masterOnly: false       # true=仅主人可用
      cooldown: 30            # 同用户两次画图最小间隔（秒；0=不限，防连点刷 GPU）
    timeout: 300              # 单次生成最长等待秒（视频工作流自动放宽到 900）
    pollInterval: 1.5         # 轮询初始间隔（秒，指数退避到 pollMaxInterval）
    pollMaxInterval: 8        # 轮询最大间隔（秒）
    maxImages: 4              # 单次最多发图数（防爆刷）
    outputDir: ""             # 产物落盘目录（留空=插件 data/temp；视频/调试用）
  skill:
    dir: "skills"
    historyCount: 15
  search:
    timeout: 0               # 搜索源超时（毫秒；0/未填=各源默认）。可给单源覆盖，如 tavily: { apiKey: "", timeout: 20000 }
    tavily:
      apiKey: ""
    exa:
      apiKey: ""
    perplexity:
      apiKey: ""
    brave:
      apiKey: ""
    searxng:
      url: ""
    ddg: true
  research:
    permission: master
    maxRounds: 3
    maxConcurrent: 3
    workerModel: ""             # 深度研究 worker 模型：空=主模型；可跨厂商（填模型条目 id 或模型名）
    evaluation: true
  mcp:
    requestTimeout: 60000
    servers:
  sticker:
    enable: false            # 表情包总开关（未开 → 不注入清单、不解析，零影响）
    maxPerReply: 2           # 单条回复最多贴纸数（1~5，硬上限 5；填 0/空/非法值按默认 2 处理，要关闭请用上面的 enable 开关）
    cooldown: 300            # 同会话两次带图回复最小间隔（秒）
    sendRate: 0.25           # 概率闸：门控通过后实际带图概率（防每条都带→更 AI）
    antiConsecutive: true    # 防连发：上一条带过则本条不带
    groupOnly: false         # 仅群聊启用
    listTopN: 30             # prompt 注入清单条数上限
    # ── 资源来源：仅自动发现（被动采集群内 image 段 → 视觉判定+打标 → 入库）──
    autoDiscover: false      # 自动发现总开关（需 sticker.enable + agent.vision.model）
    discoverGroups: []       # 采集群白名单（群号字符串；空数组=所有群都采集）
    maxDiscovered: 200       # 自动发现条目上限（超限按 usageCount 升序淘汰冷门）
    discoverMaxSizeMB: 5     # 单张采集大小上限 MB（0=不限）
    sendStickerTool: true    # 注册 send_sticker 工具：按情绪跨全库选图（不受清单 top-N 限制）
  calc:
    enable: true            # Python 精确计算工具（数学/统计/大数等，受限解释器执行，避免模型心算出错）
                            # 启用 E2B 沙箱（agent.sandbox.mode=e2b）后改在会话沙箱内执行（沙箱模板需含 python3）
    python: "python3"       # python 可执行文件（容器内路径不同可改，如 /usr/sbin/python3）
    timeout: 10             # 单次计算超时（秒，防死循环）
  diagram:
    # 示意图生成（diagram_render 工具）：LLM 提交语义 DiagramSpec → 确定性 D2 编译 → 自托管 Kroki 渲染
    # → SVG 安全检查 → resvg 高清 PNG → 随回复发送。默认禁用公共 Kroki（用户内容不得外发第三方）。
    # 部署见 docs/deploy/kroki-compose.yaml；未部署 Kroki 时工具返回结构化失败，不影响对话。
    enable: true                     # 总开关（旧键名 enabled 仍兼容）
    renderer: kroki                  # kroki（自托管容器渲染 D2，推荐）
    fallbackRenderer: none           # Kroki 失败时的本地回退：none | beautiful-mermaid（零 DOM 本地渲染，需已装依赖）
    defaultTheme: paper-blue         # paper-blue | soft-pastel | technical | midnight | sketch（sketch 仅 D2）
    defaultFormat: png               # png | svg（svg 以可编辑源文件发送）
    timeoutMs: 15000                 # 单次渲染总预算（编译+HTTP+栅格化）
    targetWidth: 1600                # 默认输出宽度（px，2x 清晰度）
    maxNodes: 50                     # spec 数量上限（节点/连线/分组/参与者/消息各自独立上限）
    maxEdges: 100
    maxWidth: 2000                   # 输出尺寸钳制
    maxHeight: 5000
    maxPixels: 10000000
    maxOutputBytes: 8388608          # 单图字节上限（超限自动降采样，仍超则 output_too_large）
    tempTtlMinutes: 30               # data/diagram/ 临时文件保留时长（定时清理只删本目录 dg-* 文件）
    kroki:
      enabled: true
      endpoint: "http://127.0.0.1:8000"  # 自托管 Kroki 地址（docker service 名/127.0.0.1/内网 IP）
      allowPublicEndpoint: false     # ⚠️ true=允许 kroki.io 公共服务（图中文字将发往第三方）；且强制 HTTPS
      allowedDiagramTypes:           # Kroki 图类型白名单（模型不可指定；新增类型需配套确定性编译器+安全测试）
        - d2
      connectTimeoutMs: 2000         # 连接/响应头超时
      requestTimeoutMs: 12000        # 单请求总超时（覆盖响应体读取全程）
      maxSourceBytes: 131072         # 编译后 DSL 大小上限
      maxResponseBytes: 4194304      # SVG 响应上限（流式字节计数）
      maxConcurrency: 2              # 渲染并发上限
      circuitBreaker:                # 连续失败熔断（防止 Kroki 宕机时每次调用都等满超时）
        enabled: true
        failureThreshold: 3
        cooldownMs: 30000
      d2:
        layout: elk                  # dagre | elk（sequence 用固定 dagre，复杂分组/ER 用 elk）
      imageTag: ""                   # 部署的 Kroki 镜像版本声明（进缓存 key；升级镜像后必须更新使旧缓存失效）
  document:
    soffice: "soffice"      # LibreOffice 可执行名/路径（file_to_pdf 转任意文件；容器装 libreoffice 后填，如 /usr/bin/soffice）
                            # 启用 E2B 沙箱后 soffice 在沙箱内执行（模板需含 libreoffice），缺则退回纯 JS 渲染
  stt:
    enable: true            # transcribe_media 工具开关（需填 apiKey 才可用；关则不注册；E2B 沙箱启用后 ffmpeg 提取在沙箱内）
    apiBase: ""             # Whisper 兼容 STT API 地址（如 https://api.openai.com/v1/audio/transcriptions）
    apiKey: ""              # STT API Key（OpenAI/Groq/Azure 等）
    model: "whisper-1"     # 模型名
    language: ""            # 语言提示（如 zh/en，留空自动检测）
  tts:                     # 语音合成（tts_speak 工具）：GPT-SoVITS（本地）/ IndexTTS 2.5（本地）/ 豆包 / MiniMax / MiMo
    enable: false          # 总开关（默认关，opt-in）：开=注册 tts_speak 并允许自动语音；关=完全静默（不注册、不合成）。仅 enable=true 时下面的 autoReply 才生效
    provider: indextts     # 当前服务商：sovits | indextts | doubao | minimax | mimo（云服务商仅在选中且配置齐全时才出网）
    autoReply: false       # 开启后每条最终回复自动合成语音（文字/图片照常发，随后追加语音）；默认关，仅 tts.enable=true 时有效
    replyMaxChars: 300     # 自动语音的最大字符数（超长按句截断，防合成出几分钟语音；0=不限）
    hdVoice: true          # 发送前高清化：响度标准化 + 存在感补偿（需宿主 ffmpeg，失败自动回退原始音频）
    sovits:                 # GPT-SoVITS（api_v2，默认 http://127.0.0.1:9880）：音色=参考音频，无音色库/无情绪参数
      endpoint: "http://127.0.0.1:9880" # 接口地址（api_v2；不是 WebUI 的 9874）
      refAudioPath: ""      # 参考音频的【服务端本地绝对路径】，3~10 秒（如 /root/.dsh/fairy-voice/reference/fairy_ref.wav）
      promptText: ""        # 参考音频的逐字文本（必须与音频一致，否则音色会漂）
      promptLang: zh        # 参考音频语种：zh/en/ja/ko/yue
      textLang: zh          # 默认合成语种：zh/en/ja/ko/yue（调用时显式传 lang 则以此为准）
      textSplitMethod: cut5 # 切段方式 cut0~cut5；长文本靠服务端切段，cut0 长文本韵律容易漂
      filterNonChinese: false # 排障用：true 时只送汉字+数字+中文标点。默认 false —— 英文由模型自带英文 g2p 发音，罗马数字/符号由服务端 clean_text 改写
      maxChars: 200         # 单次朗读上限（超出按句截断；本地卡约 0.3~0.4 秒/字，太长会超时）
      timeoutMs: 120000     # 单次合成超时（毫秒；8 GB 卡 30 秒长文本约 7 秒）
    indextts:
      endpoint: ""         # 接口地址（如 http://127.0.0.1:7860；直连 IndexTTS 本体，无需鉴权）
      lang: ZH             # 合成语言：ZH/EN/JA/AR/ES
      timeoutMs: 300000    # 单次合成超时（毫秒；情绪描述模式每段约 10~12 秒）
      voice: ""            # 默认音色参考名（上传参考音频时命名；留空=最新上传的音色）
      emotionMode: same    # same=沿用音色参考情绪 | audio=情绪参考音频 | vector=8 维情绪向量
      emotionRef: ""       # audio 模式默认情绪参考名
      emotionWeight: 0.65  # audio 模式情绪参考的影响强度 0~1
      autoEmotion: true    # vector 模式由 LLM 结合文本+上下文自动调节（false=用下面 vector 默认值）
      vector: []           # vector 模式默认向量（LLM 不可用时的回退；8 项：高兴/愤怒/悲伤/害怕/厌恶/忧郁/惊讶/平静）
      tier: pro            # vector 模式档位：pro=整段一套情绪 | max=按需拆分逐段情绪 + ffmpeg 合并
      segmentGapMs: 300    # max 档段间静音（毫秒）
      maxSegmentChars: 140 # max 档单段字符上限（防拆得过碎）
      model: ""            # 情绪判定用模型（模型条目 id/模型名；留空=tts.judgeModel→utilityModel→主模型）
      judgeTimeoutMs: 300000 # 情绪判定单次调用总预算（毫秒；历史 IndexTTS 专用键；全局 tts.judgeTimeoutMs 优先生效）
      durationFactor: 1.0  # 语速/时长系数 0.5~2.0（越小越快）
      maxTextTokensPerSegment: 100  # 服务端内部分段上限（建议 80~120）
    # ── 云服务商：仅在 provider 选中 + 本服务配置齐全时才会把讲稿发到对应平台 ──
    # 情绪判定与 IndexTTS 同一条 LLM 链路（8 维向量），再由本地映射为各服务商参数
    doubao:                # 豆包语音合成（火山引擎 Seed-TTS，HTTP Chunked）
      endpoint: "https://openspeech.bytedance.com/api/v3/tts/unidirectional"
      apiKey: ""           # 火山引擎 API Key（新版控制台 → API Key 管理；按资源开通语音合成）
      resourceId: seed-tts-2.0   # seed-tts-2.0 | seed-tts-1.0 | seed-tts-1.0-concurr（决定可用音色与计费）
      speaker: ""          # 音色 ID（控制台音色库 voice_type，如 zh_female_vv_uranus_bigtts）
      model: ""            # ""=默认 | seed-tts-2.0-standard | seed-tts-2.0-expressive（语音指令建议 expressive）
      autoEmotion: true    # LLM 判定情绪：2.0 音色→context_texts 语音指令；1.0 音色→emotion 标签
      instruct: ""         # 固定语音指令（如「用特别痛心的语气说」；留空=LLM 判定生成，仅 2.0 音色）
      emotion: ""          # 固定情感标签（1.0 多情感音色；LLM 失败/关闭时回退）
      emotionScale: 0      # 0=按判定强度自动（1~5）；手动=固定 emotion_scale
      speechRate: 0        # 语速 -50~100（100=2 倍速）
      loudnessRate: 0      # 音量 -50~100（100=2 倍音量）
      sampleRate: 24000
      format: wav          # wav | mp3（max 档分段拼接固定 wav）
      useTagParser: false  # 声音复刻 2.0 表现力增强版 Cot 标签解析
      tier: pro            # pro=整段一次 | max=LLM 分段逐段情绪后 ffmpeg 合并
      segmentGapMs: 300    # max 档段间静音（毫秒；0=不留空隙）
      maxSegmentChars: 140 # max 档单段字符上限（LLM 分段/标点回退，防拆得过碎）
      timeoutMs: 120000
    minimax:               # MiniMax 语音（T2A V2）
      endpoint: "https://api.minimaxi.com/v1/t2a_v2"   # 国际站 https://api.minimax.io/v1/t2a_v2
      apiKey: ""           # MiniMax API Key（平台 → 接口密钥）
      groupId: ""          # 可选：旧版账号 URL 查询参数 GroupId
      model: speech-2.8-hd # speech-2.8-hd / 2.8-turbo / 2.6-* / 02-* / 01-*（2.6/2.8 支持全部 9 种情绪）
      voiceId: ""          # 音色 ID（系统音色或复刻音色，如 male-qn-qingse）
      autoEmotion: true    # LLM 判定 8 维情绪 → MiniMax 标签（happy/sad/angry/fearful/disgusted/surprised/calm）
      emotion: ""          # 固定情绪标签（LLM 失败/关闭时回退）
      speed: 1.0           # 语速 0.5~2.0
      vol: 1.0             # 音量 (0,10]
      pitch: 0             # 音调 -12~12
      sampleRate: 32000
      format: wav          # wav | mp3 | flac（max 档固定 wav）
      bitrate: 128000      # 仅 mp3 生效
      languageBoost: ""    # 语种增强：留空=自动；Chinese/English/Japanese/Arabic/Spanish/auto
      tier: pro
      segmentGapMs: 300    # max 档段间静音（毫秒；0=不留空隙）
      maxSegmentChars: 140 # max 档单段字符上限（LLM 分段/标点回退）
      timeoutMs: 120000
    mimo:                  # 小米 MiMo TTS（MiMo-V2.5-TTS，OpenAI 兼容 Chat Completions）
      endpoint: "https://api.xiaomimimo.com/v1"
      apiKey: ""           # MiMo 开放平台 API Key
      model: mimo-v2.5-tts # mimo-v2.5-tts（预置音色）| mimo-v2.5-tts-voicedesign（文字设计音色，style 必填）
      voice: mimo_default  # 预置音色：mimo_default/冰糖/茉莉/苏打/白桦/Mia/Chloe/Milo/Dean
      autoEmotion: true    # LLM 判定 → 自然语言风格指令（复合情绪/语速/发声方式/导演式）+ 音频标签
      style: ""            # 固定风格/音色描述指令（留空=LLM 生成；voicedesign 必填；可写"用东北话说""用唱歌的方式"）
      tagMode: auto        # 音频标签：auto=句首 (风格) + 行内 [标签]（原文保真校验，改写即丢弃）| style=只加句首 | off=不用
      format: wav          # wav | mp3（max 档固定 wav）
      tier: pro
      segmentGapMs: 300    # max 档段间静音（毫秒；0=不留空隙）
      maxSegmentChars: 140 # max 档单段字符上限（LLM 分段/标点回退）
      timeoutMs: 120000
    judgeModel: ""         # 情绪判定模型（对 IndexTTS/豆包/MiniMax/MiMo 统一生效；留空=indextts.model→utilityModel→主模型）
    judgeTimeoutMs: 300000 # 情绪判定总预算（毫秒，默认 5 分钟，统一生效）
  sandbox:                # E2B Firecracker 沙箱：terminal 工具的唯一执行面 + toolEvo 的隔离面
    # terminal 工具的唯一执行面 / toolEvo 的隔离面：命令在独立 microVM 内执行，宿主**不再有任何 shell 执行面**
    # （旧 agent.terminal 已废弃，可直接删除）。注意：沙箱化后 terminal 为**全员可用**（category=query，
    # 按会话隔离沙箱，成本由单会话命令数/并发/超时兜底），不再有「仅主人」「#确认」审批与命令黑名单；
    # 网络出口默认放通，可用 sandbox.network.allowInternet:false 或 allowOut 白名单收紧。
    # mode: off 时 terminal 工具不注册（toolEvo 退回本地 fork 档）；连不上 E2B 一律拒绝执行，绝不回退本地。
    mode: off            # off | e2b
    apiKey: ""           # E2B 云或自托管团队 key（★敏感：已接入 redactSecrets 脱敏）
    apiUrl: ""           # 自托管控制面，如 http://192.168.1.10:3000；留空=云默认 api.{domain}
    domain: ""           # 自托管沙箱域名（{port}-{sandboxID}.{domain}）；留空=云默认 e2b.app
    sandboxUrl: ""       # 自托管无通配 DNS 时填 client-proxy 地址（SDK 自动附路由头）；留空=默认
    template: base       # 沙箱模板（CPU/内存/预装依赖由模板承载；插件侧只加硬超时与网络白名单）
    verifyTemplate: ""   # 可选：toolEvo 行为验证专用模板（留空=复用 template）
    maxTimeout: 600      # 单命令超时上限（秒）
    defaultCwd: /home/user  # 沙箱内默认工作目录（宿主路径在沙箱内无意义）
    idleMs: 300000       # 闲置回收：会话沙箱空闲超时（毫秒）
    sandboxTtlMs: 600000 # 沙箱 TTL（毫秒）；命中租约且过半衰时自动续期
    maxSandboxes: 4      # 全局并发沙箱上限（超出进入等待队列）
    concurrencyWaitMs: 15000  # 等并发名额的最长时间（毫秒），超时按配额失败
    maxCommandsPerSession: 50 # 单会话命令数上限（防长任务把配额/账单打爆；0=不限）
    requestTimeoutMs: 60000   # SDK 单请求超时
    retries: 1           # SDK 重试次数（云默认 3，降为 1 控延迟）
    allowPublicTraffic: false # 沙箱公开 URL 也要求 token（默认收紧）
    network:
      allowInternet: true     # true=默认放通全部出口（与 E2B 自身默认一致，包管理器/下载/API 开箱可用）；
                              # false=拒绝全部（显式断网；配了 allowOut 白名单时白名单仍放行）
      allowOut: []            # 出口白名单（可选：opt-in 收紧）：留空=不限；填了只放行这些域名/CIDR，其余全部拒绝
                              # 注意：只写 IP/CIDR 时 E2B 不会自动放行 DNS(8.8.8.8:53)——白名单里请写域名
      denyOut: []             # 额外拒绝网段（可选；如 169.254.169.254/32 防云元数据）；留空=不加额外拒绝
                              # ★不要在这里写 0.0.0.0/0：E2B 的 allow 规则优先于 deny，没有白名单时它=
                              #   拒绝一切出口（含 DNS），沙箱会完全无法联网。要断网请用 allowInternet:false。
                              #   旧版默认值 ['0.0.0.0/0'] 会被自动清理并写回（见 #沙箱诊断）
    audit: true          # 每条命令写审计日志（会话键/退出码/命令前 200 字符，不含密钥）
    toolEvoVerifyTimeoutMs: 5000  # toolEvo 候选行为验证：单用例超时（沙箱模式）
  stagehand:
    # Stagehand 浏览器自动化（act/extract/observe 自然语言原语，LLM 把指令映射到页面元素）。
    # permission=master：仅主人（默认）；=all：全部成员可用 goto/observe/extract，act 写动作仍需主人 #确认。
    # 安全：goto 强制拒绝内网/环回/元数据地址（防 SSRF），并按会员限流；本地浏览器跑在宿主进程，非沙箱。
    # 会话按「机器人+群/私聊+真实操作者+对话」隔离 + idle 自动关 + 全局会话上限；同会话操作串行。
    # 依赖 @browserbasehq/stagehand + zod-stagehand（云崽根 pnpm install 随 workspace 装入插件）；本地模式另需 chromium+系统库。
    enable: false
    permission: master     # master（仅主人，默认）| all（全部成员）；浏览器跑在宿主，默认收紧
    mode: local            # local（本地 Playwright+chromium，默认）| cloud（Browserbase 云浏览器）
    headless: true         # 本地模式是否无头
    stealth: true          # 真机化：随机设备指纹(UA/视口/语言/触屏)+去自动化 flag+规避脚本，降低被风控拦截概率
    userAgent: ""          # 指定固定 UA（留空=按设备指纹池随机）
    executablePath: ""     # 本地 Chrome/Chromium 可执行文件；留空=自动探测（CHROME_PATH/PUPPETEER_EXECUTABLE_PATH → Puppeteer 自带 → ~/.cache 缓存 → 系统路径）。服务器装了 chromium 或 Yunzai 自带 puppeteer 通常无需填
    browserbaseApiKey: ""  # 云模式必填（bb_live_...）
    region: ""             # 云模式可选：us-west-2(默认)/us-east-1/eu-central-1/ap-southeast-1
    modelName: ""          # Stagehand 原生模型（如 google/gemini-2.5-flash；空=复用插件 provider，仅 OpenAI 兼容；云模式空=Model Gateway 自动选）
    modelApiKey: ""        # 原生模型 apiKey（云模式部分 provider 可空）
    idleTimeoutMs: 300000  # 会话空闲多久自动关（默认 5 分钟）
    maxSessions: 3         # 全局并发浏览器会话上限（含启动中/关闭中）
    opTimeoutMs: 60000     # 单次浏览器操作截止时间（超时/取消拒绝迟到结果并清理会话）
    llmTimeoutMs: 30000    # 单次 LLM 推理截止时间（覆盖请求 + 响应体读取）
    maxCallsPerMinute: 10  # 每会员每分钟浏览器操作上限
    maxCallsPerDay: 200    # 每会员每日浏览器操作上限
    blockedHosts: []       # 额外禁访主机（在默认内网/元数据黑名单之外）
    domSettleTimeoutMs: 3000  # act 前 DOM 稳定等待（毫秒）
  tempFiles:
    # 插件临时目录（data/temp）自动清理（2026-10-17 审计 A6）。该目录会积累 PDF/Excel 转档、
    # STT 音频、下载中转、渲染图、日志包……此前只有 diagram 有专属清理，其余只增不减（磁盘满后
    # 媒体/文档功能整族失败）。清理只删普通文件、不跟随符号链接、不越出 temp 目录，目录本身保留。
    enable: true            # 关掉则完全不清理（不建议）
    ttlHours: 24            # 超过该时长的临时文件删除
    maxFiles: 500           # 目录内文件数上限（仍超限时从最旧的开始删）
  download:
    # 媒体下载工具（yt-dlp；仅框架主人，受约束）。下载视频/音频时 LLM 优先用 web_download，不走 terminal 裸 shell。
    # 依赖系统 yt-dlp + ffmpeg（合并格式）。默认开。启用 E2B 沙箱后下载在沙箱内执行（模板需含 yt-dlp）。
    enable: true
    maxMB: 600              # 单文件大小上限（yt-dlp --max-filesize，超限中止）
    sendLimitMB: 100        # 超过此大小不自动发 QQ（返回本地路径，供 SFTP 取）
    maxTimeoutSec: 600      # 单次下载超时上限（秒）
    bin: ""                 # yt-dlp 可执行路径（空=PATH 中的 yt-dlp）
    dir: ""                 # 输出目录（空=插件 data/temp/downloads）
    allowPrivateHosts: false # 允许下载本机/内网/元数据地址（默认 false：防 SSRF；仅本地媒体服务器调试时打开）
  multiagent:
    # 子代理编排：主 Agent 可自主创建子代理委派任务。LLM 自己判断何时需要拆分。
    # 子代理是隔离 Agent（看不到主对话历史），只做被委派的任务，返回结果文本。
    # 安全：子代理只能用 query 类工具（搜索/记忆/计算），群管/系统/终端不可；不会递归创建子代理。
    enable: true
    topology: spawn             # spawn=异步三件套 spawn/check/extend_subagent（默认）| orchestrator=同步编排工具 orchestrate
    maxConcurrent: 3            # 同时运行的子代理数上限
    maxSpawnsPerConversation: 5 # 单次对话最多创建几个子代理（topology=spawn 时生效）
    workerMaxTurns: 200          # 子代理工具循环上限（防失控烧 token；200=给足步数，靠 loop.* 智能终止兜底）
    workerTimeBudgetMs: 3600000  # 子代理时间预算（毫秒，默认 60 分钟；spawn_subagent 未传 timeBudgetMs 时用它，工具侧 2 小时封顶，可 extend 续期）
    workerMaxTokens: 16384       # 子代理单轮最大输出 tokens（防长报告被 max_tokens 拦腰截断）
    resultCap: 48000             # 子代理结果回传上限（字符）：check_subagent/编排结果给主代理的完整度（防长报告被腰斩）
    reserveTokens: 32000         # F13：编排（orchestrate）开始前向根任务预留的 token 额度；不足则拒绝启动
    workerModel: ""             # 子代理模型（空=复用主模型；可跨厂商，填便宜模型可降本）
    defaultTools:               # 子代理默认可用工具（模型未指定时）
      - web_search
      - memory_search
  webApi:
    enable: true           # Web 管理面板（独立 HTTP 服务，脱离锅巴）：主人私聊发 #agents登录，分两条消息返回【公网地址】与【本地地址(127.0.0.1，固定生效、无配置)】（token 24h 有效）
    port: 6098             # 监听端口（0.0.0.0，同时覆盖公网与本地回环）；默认避开 Yunzai 2536 / 锅巴 6099
    publicUrl: ""          # 对外访问地址（留空自动探测公网/LAN IP；填 http://1.2.3.4:6098 覆盖。本地地址不受此影响，固定 127.0.0.1）
    printTokenOnStart: true # 启动时在日志打印带 token 的默认访问地址（+写 data/web/console-url.txt）：首次部署还没有协议端、发不了 #agents登录 时，直接用它进面板完成配置
    consoleTokenTtlHours: 720 # 启动地址令牌有效期（小时，默认 30 天；使用中滑动续期，过期后下次启动自动换新）
  # ─────────────── 伪人模式（群聊环境参与者）───────────────
  # 在现有任务型 Agent 旁新增一条「持续旁听→低成本门控→工具化决策→独立表达→可中断发送」的流水线。
  # 红线：环境模式普通 assistant 文本永不发送；只有 human_reply/human_react 才产生对外消息。
  # 默认全关 + shadow（只记录决策不实发）；需显式白名单 groups 才生效。详见 trss-agent-plugin-humanlike-mode-development-guide-v1.0.md
  humanize:
    # ⚠️ 伪人模式为早期开发，很不稳定，默认关闭。开启前请仔细阅读 model/humanize/ 源码。
    # 已知问题：评分粗糙（纯关键词）、无效果追踪、无表达学习、Planner 可能抢答/重复。
    # 建议：shadow=true 观察 #伪人决策 质量后再放量。
    enable: false                  # 总开关（即便 true，groups 为空也不开启）
    vision:
      allowPrivateHosts: false     # 伪人看图是否允许私网/回环图片地址（默认 false；自建图床才开，防 SSRF）
    groups: []                     # 显式白名单群号（字符串）；空数组=不开启
    groupsOverride: {}             # 可选：按群覆盖 humanize 配置（{ "群号": { ... } }，深度合并到本块）
    shadow: true                   # true=只记录决策 trace、不真实发送（先观察再放量）
    talkValue: 0.35                # 0~1 主动性基线（不等于回复概率）
    debounceMs: 1200               # 消息安静窗口（ms）：burst 后等此窗口再评估
    plannerTimeoutMs: 30000        # 单轮 Planner 超时（ms）；超时默认沉默
    maxPlannerRounds: 4            # Planner 内部工具循环最大轮数
    contextMessages: 30            # 注入 Prompt 的最近消息条数（存储 150，注入 30）
    threshold: 80                  # 必要性评分阈值（final>=80 才进 Planner）
    cooldownSeconds: 45            # 成功回复后冷却（秒）
    presenceWindowSeconds: 300     # 在场占比统计窗口（秒，默认 5 分钟）
    maxRepliesPer10Minutes: 4      # 10 分钟内最大回复数（频率硬上限）
    bufferCapacity: 150            # 单群消息缓冲条数
    bufferTtlHours: 2              # 缓冲 TTL（小时）
    knownBots: []                   # 已知其它 bot 账号（QQ号，如林墨的bot）：互相连续对线3轮且无真人 → 熔断10分钟
    memory:                        # 伪人独立记忆库（独立 sqlite：data/humanize/memory.db；与主 Agent 记忆完全隔离）
      enabled: true                # 每日 04:47 睡眠整合近期对话→长时记忆；Planner/Replyer 按相关性检索注入
      model: ""                    # 伪人记忆抽取/整合模型（留空=utilityModel→主模型；可跨厂商，填模型条目 id 或模型名）
      maxPerQuery: 5               # Planner 单次注入条数
      maxPerGroup: 300             # 单群容量（超量按重要性×使用率淘汰）
      incrementalMinMessages: 20   # 每小时增量整合水位（新增≥N条才跑——梗当天入库，不用等次日）
      minConsolidateMessages: 6    # 整合所需最少消息数（低于此不跑整合）
      forgetDays: 30               # 超龄硬遗忘（天）
    idleBackoffBaseSeconds: 15     # 连续无动作退避基数（15/30/60/120/240…）
    idleBackoffCapSeconds: 300     # 退避上限
    idleBackoffStartCount: 2       # 第几次无动作起开始退避
    bypassPendingCount: 6          # 待处理新消息达此数绕过退避
    redactSecrets: true            # 伪人回复发送前脱敏（拦截秘钥/Token）。⚠️ 与顶层 agent.redactSecrets 同名不同层：这里管伪人链路，顶层管主 Agent 链路
    personaName: ""                # 机器人在群里的名字（留空=用 Bot.nickname）
    botId: ""                      # 机器人自身 QQ（留空=自动探测 Bot.uin）
    persona:                       # 群聊角色人设（MaiBot 式，与主 Agent 共用 PersonaStore 人设库）
      name: ""                     # 角色名（人设库模式以库中名为准；留空=用 personaName）
      prompt: ""                   # 自定义角色卡正文（人设库未命中/正文为空时生效）。示例见下方注释
      fromPersonaId: ""            # 优先复用 PersonaStore 人设（id/名，如 raiden-ei），其正文优先于自定义卡
      aliases: []                  # 角色别名（参与 @/提及昵称判定；与 name 一同构成 identityNames）
      # prompt 示例（MaiBot 式角色卡，取消注释按需改）：
      # prompt: |
      #   你是「小汐」，群里一个爱聊天的技术宅。性格随和有点皮，喜欢接梗。
      #   【语气】轻松口语，偶尔用「哈」「确实」这类语气词，不端着。
      #   【口癖】赞同别人时爱说「确实是」；遇到有意思的会回「有点东西」。
      #   【距离感】对熟络的群友随意，对新人礼貌但不冷场。
      #   【偏好】对 AI/编程/数码话题兴致高；八卦闲聊也会接，但不主动挑起。
      #   【不做】不发长篇大论、不列要点清单、不每次都称呼对方。
    planner:
      model: ""                    # Planner 模型 id（留空=utilityModel→主模型；可跨厂商）
      temperature: 0.2
      maxTokens: 800
      allowedReadTools: []         # Planner 可用的只读工具白名单；写/删/管理/终端/发送类一律拒绝
    replyer:
      model: ""                    # Replyer 模型 id（留空=主模型）
      temperature: 0.7
      maxTokens: 500
      maxChars: 500                # 超长则低温重写
    reply:
      maxBubbles: 3                # 单次回复最多气泡数
      typingSpeed: 1.0             # 输入延迟倍率（越大越快）
      minDelayMs: 600
      maxDelayMs: 3500
      typos: false                 # 自动错字（第一版强制 false）
      allowSticker: true           # 允许尾随表情包（复用 sticker cooldown/sendRate）
    behaviorPolicy:                # 「何时参与」（与「怎么说」的人设分离）
      topics: []                   # 关注主题（命中 +10~25）
      avoidTopics: []              # 回避主题
      initiative: 0.35
      humor: 0.4
      answerUnknownQuestions: false
      interruptHumanConversation: false
      maxRepliesPer10Minutes: 4   # 兼容旧键（实际生效值取上层 humanize.maxRepliesPer10Minutes）
    safety:
      privateMemoryInGroup: false  # 隐私红线（强制 false，不可改）
      maxConcurrentGroups: 1       # 同时 Planning 的群数上限

  # ───────────────── 群聊小世界 GroupWorld（社会记忆层） ─────────────────
  # 按群隔离、持续更新、带证据/会遗忘/可局部检索的稀疏社会关系网络。设计文档：trss-agent-plugin-groupworld-design-v1.0.md
  # 数据落 sqlite（data/groupworld/gw.db）。online 默认 false：先观察画像质量，翻 true 才注入 Planner/Replyer。
  # 语义层（embedding 检索相似度/近义合并/事件语义去重）复用 recall 的 embedding 配置
  # （agent.recall.embedProvider / embedBaseURL / embedApiKey）；未配置则全部走词面相似度，功能不受阻。
  groupWorld:
    enabled: false                 # 总开关（即便 true，groups 为空也不开启）
    groups: []                     # 显式白名单群号；空数组=不开启
    online: false                  # 在线注入伪人 Planner/Replyer（默认关：先观察再上线）；注意消费方只有伪人链路，需 humanize.enable=true 且群在 humanize.groups 白名单内才有效

    ingestion:
      rawMessageRetentionDays: 30  # 原始消息保留天数（超过由每日维护清理）
      segmentIdleSeconds: 300      # 会话切片静默阈值（文档 3~8min，默认 5min）
      segmentMaxMessages: 100      # 单片段最大消息数（文档 60~120）
      ignoreCommandMessages: true  # #指令消息不摄入
      topicShiftEnabled: true      # 主题漂移切分（TextTiling 式；换话题无静默间隙也提前分割）
      topicShiftWindow: 6          # 参与漂移比较的近窗有效消息数
      topicShiftSimThreshold: 0.06 # 新消息与近窗相似度低于此值 → 分割（保守防碎片化）

    analysis:
      schedule: "7 * * * *"        # 小时增量分析 cron（每小时 :07）
      minSegmentMessages: 4        # 有效信息量低于此值的片段跳过分析
      maxSegmentsPerRun: 50        # 每轮最多分析片段数
      modelProfile: ""             # 分析模型 id（留空=主模型/utilityModel；可跨厂商）
      maxDailyCallsPerGroup: 100   # 每群每日 LLM 调用预算（熔断）
      retryCount: 1                # 模型非法 JSON 重试次数（仍失败→dead_letter）
      maxTokens: 1200
      episodeMergeSim: 0.85        # 事件语义去重阈值（embedding 余弦；需配 recall.embedProvider）

    profiles:
      hotActiveDays30d: 10         # 近30天活跃天数≥此值=hot（维护完整画像）
      warmMessageCount30d: 5       # 近30天发言数≥此值=warm
      minOnlineConfidence: 0.55    # 在线上下文最低置信（不可低于0.55；低置信推断不进回复）
      maxTraitsPerUser: 5          # 每成员在线返回画像上限
      traitMergeSimThreshold: 0.82 # 近义特征聚类合并阈值（每日维护；embedding 余弦）

    graph:
      activeEdgeDays: 90           # 关系边活跃窗口
      maxNeighborsPerUser: 40      # 每成员活跃一跳关系上限
      weeklyCommunityDetection: true  # 每周小圈子识别
      minCommunitySize: 3          # 最小圈子人数

    retrieval:
      plannerTokenBudget: 800      # Planner 社会现场 token 预算
      replyerTokenBudget: 500      # Replyer 社会现场 token 预算
      maxEpisodes: 3               # 在线返回共同经历上限
      maxRelationships: 5          # 在线返回关系上限
      cacheTtlSeconds: 60          # 社会现场短 TTL 缓存

    privacy:
      allowUserOptOut: true        # 允许 #关闭我的群聊建模
      allowUserInspect: true       # 允许 #查看我的群聊画像
      allowUserCorrect: true       # 允许 #纠正我的群聊画像
      blockSensitiveInference: true  # 拦截敏感推断（健康/政治/性取向/证件等）

  # ───────────────── SelfState 自我认知与情绪（GroupWorld 配套层，Phase 0-4） ─────────────────
  # 设计文档：trss-agent-plugin-groupworld-selfstate-design-v1.1.md
  # 红线：情绪只是偏置（不覆盖权限/安全/功能指令/工具结果）；不外显数值；跨群隔离；
  #      禁卖惨/跨用户扩散/功能报复；负状态超时恢复。数据与 GroupWorld 同库（data/groupworld/gw.db，ss_ 前缀表）。
  selfState:
    enabled: false              # 总开关（关=整层 no-op）
    shadowMode: true            # 计算入库但不影响发言（观察期）；false 才注入伪人 Planner/Replyer（需 humanize.enable=true，否则单开无效果）
    groups: []                  # 可选：定时反思/维护的群号白名单；留空=复用 groupWorld.groups → humanize.groups

    scope:
      isolateByGroup: true      # 群级隔离（唯一模式）

    eventDetection:
      semantic: true                     # 语义近邻检测层（需 agent.recall.embedProvider 配 embedding 模型；未配自动回落关键词）
      ambiguousIntentModelProfile: ""   # 歧义评价模型（留空=主模型）
      minEventConfidence: 0.55

    emotion:
      maxNormalImpulse: 0.20        # 普通事件单次脉冲上限
      maxHighSalienceImpulse: 0.35  # 高置信公开重复攻击上限
      minVisibleIntensity: 0.18     # 低于此强度不进投影
      maxActiveEmotions: 8
      enableMixedEmotions: true     # 允许多情绪并存（不压成单标签）
      lazyDecay: true               # 懒衰减（读时算，无定时扫描）
      moodEmaAlpha: 0.3             # 心境 EMA 惯性系数（0=冻结 1=无惯性；被骂后低落持续而非半小时反弹）
      moodResetHours: 6             # 超时无迁移自动回基线（睡一觉恢复）

    resentment:
      enabled: true
      minCreateConfidence: 0.72
      maxSingleEventDelta: 0.05     # 单次怨气增量上限
      halfLifeDays: 7

    expectations:
      enabled: true
      minimumWindowSeconds: 90      # 动态等待窗下限
      maximumWindowSeconds: 3600
      minIgnoredConfidence: 0.65    # ignore_score 达此值才算高置信冷落
      requireTargetActivityEvidence: true

    reflection:
      enabled: true
      minSignificantEvents: 3
      maxReflectionsPerDay: 10
      defaultTtlDays: 7

    planner:
      includeStateProjection: true
      maxStateTokens: 220
      emotionIsBiasOnly: true       # 强制 true（红线）

    replyer:
      includeExpressionCapsule: true
      exposeNumericState: false     # 强制 false（红线：不外显数值）
      allowNaturalEmotionDisclosure: true

    stability:
      noCrossUserSpillover: true    # 强制 true（红线）
      preventEmotionalBlackmail: true  # 强制 true（红线）
      preventSelfHarmNarratives: true  # 强制 true（红线）
      maxNegativeMoodHours: 24      # 负心境超时 → 恢复流程

    retention:
      transitionLogDays: 14
      resolvedEmotionDays: 7
      resolvedExpectationDays: 7

