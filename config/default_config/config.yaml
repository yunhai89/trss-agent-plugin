debug: false

agent:
  trigger: at
  triggerCommand: "#ai"
  privateChat: false   # 私聊是否触发对话（默认关；false=私聊不响应，仅群内 @/命令触发）
  isolation:
    enable: true  # 多用户数据隔离（默认开）。true=每个群每个用户完全独立（会话/长期记忆/recall/群历史可见范围）；false=同群完全共享（群体型 bot，会话+记忆+群历史全群共用）。跨群始终隔离；私聊始终按用户。提醒/笔记/人设始终按用户。
  # ── 基础模型：引用下方「厂商配置 / 模型列表」的条目，不在此单独设置 ──
  providerId: ""      # 选中的厂商条目 id（Web 配置中心 → 厂商配置；运行时由此解析 protocol/preset/baseURL/apiKey）
  modelId: ""         # 选中的模型条目 id（模型列表；须属于上面 providerId 指向的厂商）
  # ↓ 以下 5 项是上面引用的解析结果（只读镜像，每次加载自动回填，勿手改；
  #   它们是给老兼容读点用的快照，改厂商 Key / 改模型都会自动跟随）
  protocol: openai  # openai | anthropic | gemini（gemini=原生官方 @google/genai SDK + Interactions API，填 apiKey 即用，无需 baseURL/preset）
  preset: deepseek  # 厂商预设（openai/deepseek/gemini/dashscope/zhipu/moonshot/mimo/minimax/openrouter/opencode=按量 /opencode-go=月付订阅$5起）；gemini 原生协议时仅占位
  baseURL: ""
  apiKey: ""               # API Key（OpenAI/Anthropic 兼容或 Gemini 原生均填此）；★必填：留空则插件不初始化
  model: "deepseek-chat"
  utilityModel: ""  # 旁路小模型（播报等）：填模型条目 id 或模型名，可来自任意厂商（运行时按注册表解析端点）；留空=沿用主模型

  # ── 厂商/模型注册表（web 配置中心 → 厂商配置 / 模型列表 两区维护；运行时经上面 providerId/modelId 引用）──
  llmProviders: []  # [{ id, name, protocol, preset, baseURL, apiKey }] LLM 服务商端点（「厂商配置」区维护）
  llmModels: []     # [{ id, name, providerId, model, temperature, maxTokens, note }] 模型条目（挂在某厂商下，「模型列表」区维护）
  # 回退模型：主模型失败时依次尝试。每条独立 baseURL/apiKey/protocol（可跨厂商）。
  # 多回退用数组（在此 yaml 配）：例：主 DeepSeek，回退 GPT
  #   fallbackModels:
  #     - model: "gpt-4o"
  #       baseURL: "https://api.openai.com/v1"
  #       apiKey: "sk-gpt-xxx"
  #       protocol: "openai"
  fallbackModels: []
  # 锅巴面板单回退（扁平字段，方便表单填写；多回退用上面 fallbackModels 数组）
  fallbackModel: ""        # 回退模型 id（如 gpt-4o）
  fallbackBaseURL: ""      # 回退 baseURL（如 https://api.openai.com/v1）
  fallbackApiKey: ""       # 回退 apiKey
  fallbackProtocol: "openai"  # openai | anthropic
  proxy: ""  # HTTP/SOCKS 代理（如 http://127.0.0.1:7890 或 socks5://127.0.0.1:1080）；国内服务器访问 GPT/Gemini 等海外 LLM 用，留空=直连
  reasoningFields: []
  maxTurns: 25  # 单次对话工具调用轮次预算上限（默认 25；配合下方 loop.* 智能终止，实际很少触顶）
  loop:                       # 循环智能终止（审计 §2.1）：独立于 maxTurns 硬上限，额外检测死循环/停滞/预算耗尽
    maxSameAction: 2          # 同工具+相同参数连续允许次数（超出 → duplicate_action 终止，防 ping 死循环）
    maxConsecutiveFailures: 3 # 连续工具失败次数上限（超出 → consecutive_failures 终止）
    noProgressWindow: 4       # 连续 N 步无新事实 → no_progress 终止
    timeBudgetMs: 300000       # 单次对话工作时间预算（毫秒，超出终止在途调用并进入收尾）
    tokenBudget: 240000       # 单次对话累计「有效工作 token」上限：未命中输入 + 缓存写 + 输出；缓存命中读按 0.1x 折算。
                             # （与真实成本对齐：长上下文整段被缓存时按全价计会几轮就误杀长任务）
                             # 语义：调模型前按「已用有效 token + 最近一轮有效增量」预检，不再启动注定超支的一轮；
                             # 收尾总结调用独立预留（不占本预算）。
    finalizeGraceMs: 45000   # 收尾宽限：预算/时间耗尽后，收尾总结调用可用的独立时间窗（只受用户取消约束）
  temperature: 0.2  # 工具调用稳定性（建议 0.1~0.3；勿设 0 避免复读式回复）
  thinking:
  thinkingAuto:            # 思考自动决策（opt-in）：按提问复杂度自动决定是否思考与深度；开启后覆盖上面的手动 thinking（模型级 thinking 覆盖仍优先）
    enable: false          # 打开后 Agent 每轮判定：闲聊/简单问题不思考，复杂问题按深度思考
    classifier: auto       # 判档方式：auto=规则不确定时用小模型判（省调用）/ always=总是小模型 / off=纯规则 / jev=由 Jev 判档（需开启 Jev）
    model: ""              # 判档小模型（留空=utilityModel→主模型；建议廉价小模型）
    timeoutMs: 2500        # 小模型判档超时（超时/失败自动回退规则，不阻塞对话）
    maxBudget: 32768       # 自动思考预算硬顶（tokens；防单轮烧太多）
    budgets:               # 各深度预算（tokens；质量优先，取值偏宽松）
      low: 4096
      medium: 8192
      high: 16384
    style: ""              # 传输风格覆盖（留空=按厂商预设自动；如 reasoning_effort / thinking_toggle / enable_thinking / deepseek / minimax / anthropic_budget / gemini_level）
  # ── Jev（TypeSafe AI 判断模型，opt-in，默认关）──
  # ⚠️ 安全警告：启用后会把**用户对话内容 / shell 命令**发往第三方 TypeSafe（typesafe.ai）做结构化判断，
  #    属新增数据外发面。默认关闭；仅在明确知晓并接受该风险时开启。所有决策点失败/低置信一律无感回退
  #    现有方案（思考→规则+小模型；工具→tool_search；reflect→auto；shell→现有行为），不阻塞对话、不 500。
  #    Jev 现在作为「厂商 + 模型」注册（厂商配置里选 jev 预设；模型列表挂 jev 模型），在「基础 / 模型」卡片
  #    打开 Jev 开关并选择厂商/模型；问题/阈值/模型 ID 集中在 model/agent/jev/spec.js 一起版本化。
  jev:
    enable: false          # 总开关（opt-in；关闭时下列 decisions 全部不生效，零影响）
    providerId: ""         # Jev 厂商引用（「厂商配置」中 preset=jev 或 openrouter 的条目）
    modelId: ""            # Jev 模型引用（「模型列表」中该厂商下的模型条目）
    model: ""              # 手填模型 ID（留空=用 modelId 指向的注册模型；可直接填 jev-latest / jev-1.13.0）
    timeoutMs: 4000        # 单请求超时（毫秒；超时/失败自动回退。Jev 典型延迟 ~100-300ms，4s 已很宽松）
    maxRetries: 1          # 408/429/5xx 重试次数（401/422 不重试；遵守 Retry-After）。连续失败 3 次熔断 30s
    maxStateChars: 32000   # LLM jev 工具单次 state 字符上限（防上下文/计费失控）
    toolSelectionMaxTools: 80  # 工具选择最多发给 Jev 的候选工具数（64k 上下文保护）
    decisions:             # 各决策点是否走 Jev（多数由对应卡片的选择器派生；见 apps/agent.js）
      llmTool: false       # 注册 jev 工具供主 LLM 主动调用（把 state+questions 发给 Jev 取结构化答案）
      terminalRisk: false  # shell 命令执行前用 Jev 判定风险（破坏性默认拒绝；回退：现有行为）
    allowDestructive: false  # shell 风险：是否允许"高置信破坏性"命令执行。false=破坏性一律拒绝（fail-closed，推荐）；
                             # true=仅当 Jev 置信度 ≥ thresholds.terminalRiskFloor 才放行（终端无审批，请谨慎）
    thresholds:            # 置信度门控阈值（集中可配；按"答错的代价"校准）
      lowConfidence: 0.5       # 通用低置信边界（低→回退）
      highConfidence: 0.9      # 通用高置信边界（高→才允许破坏性动作）
      thinkingMinConfidence: 0.5  # 思考档位低于此值回退规则判档
      toolNoulFloor: 0.6       # 工具 noul 概率达此值才激活
      terminalRiskFloor: 0.75  # 破坏性命令需达此置信度才允许执行（allowDestructive=true 时）
      reflectFloor: 0.5        # reflect noul 概率达此值才触发反思
  # shell 安全：自定义拦截指令（在 terminal 执行前做确定性拦截，与 Jev 是否开启无关）
  shell:
    intercept: []          # 需拦截的指令片段列表（大小写不敏感子串匹配；命中即拒绝执行，如 "rm -rf /"）
  maxTokens:              # 单次回复最大 token（留空=厂商默认；Anthropic 默认 4096）
  contextWindow:          # 模型上下文窗口 token 数（如 32000）；配置后启用 token 高低水位压缩（超 65% 压到 45%、保留首条意图、cacheEpoch 分代），未配置按消息条数水位（30→18）压缩
  compaction:               # 无损上下文压缩（Hermes 四阶段可逆化）：被移出窗口的原文整块归档（sha256 校验），
    enable: true            # 窗口内留结构化台账 + context_recall 工具按 ref/关键词恢复；false 关闭归档与恢复工具（回滚杠杆）
    archiveDir: "data/context-archive"  # 压缩原文归档目录（按会话分目录，独立于会话数据生命周期）
  maxToolResultChars: 8000  # 单条工具结果字符上限（内容获取类工具可经 meta.resultCap 单独放宽到 12000）
  keepReasoning: false      # 是否把推理(reasoning_content)回灌历史（默认 false 省 context）
  stream: false             # 逐字流式输出（依赖适配器、不稳，默认关）
  reflect: auto             # 自我反思/自纠：off=关 | auto=仅多轮/用工具时(默认) | always=每次最终回复都反思 | jev=由 Jev 判断是否需要反思
  cacheControl: false      # Anthropic 协议显式 prompt 缓存断点（tools/system/末消息；OpenAI 兼容端自动前缀缓存无需开）
  reflectMaxIterations: 1   # 反思回环修正最大次数（封顶防无限循环）
  progress: true            # 工具调用时推送节流进度消息（消除干等，默认开）
  progressRecall: 3         # 进度消息多少秒后自动撤回（默认 3；适配器不支持则忽略）
  reply:
    mode: image             # 回复渲染：image（markdown→精美浅色图片，默认）/ text（纯文本）；渲染失败自动退文本
    atSender: true          # 群聊回复时艾特发言人（私聊不艾特）
    narrate: true           # 中途播报：模型调工具时附带的思路/进展文本自动转发给用户（OpenClaw 式）
    renderScale: 3          # 回复图片渲染倍率（deviceScaleFactor，3=超清默认；2=高清；1=普通；越大越清晰但越耗内存/体积）
  memoryLimits:             # 声明式记忆字符上限 {memory:2200,user:1375}；留空=默认
  memory:
    enable: true            # 声明式记忆总开关（关则不注入 MEMORY.md/USER.md）
    threatScan: true        # 写长期记忆前扫描指令注入（命中降置信+标 suspect，召回屏蔽，#记忆 仍可见原文）
  recall:
    cap: 200                # 每用户长期记忆条数上限（超限按价值淘汰，非 FIFO）
    extractEvery: 10        # 每 N 轮触发一次 LLM 抽取（意图词"记住/叫我"等仍即时触发）
    minScore: 0             # 召回最低综合分阈值（0=仅过滤零相关；配 embedding 后可调大如 0.3）
    diversity:              # 去冗余：候选多于 topK 时按 MMR 兼顾相关与多样
      enable: true
      lambda: 0.7           # 1=纯相关排序；越小越鼓励多样（建议 0.5~0.8）
      perTypeCap: 3         # 同一 type 最多入选条数（选不满 topK 时自动放宽）
    usage:                  # 使用反馈：反复注入却从未被引用的记忆轻微降权
      enable: true
      containment: 0.5      # 最终回复对记忆词元的包含率 ≥ 此值判为"被引用"
      penalizeAfter: 5      # 注入达此次数且从未被引用 → 降权
      penalty: 0.5          # 降权系数（0.5=权重减半）
    model: ""               # 抽取用模型 id（留空=utilityModel→主模型；可跨厂商）
    embedProvider: ""       # 语义召回 embedding 模型 id（留空=关键词 jaccard；填则走 cosine 语义匹配）
    embedBaseURL: ""        # embedding 接口地址（留空=复用主 baseURL；用专门 embedding 服务时填，如 https://api.openai.com/v1）
    embedApiKey: ""         # embedding apiKey（留空=复用主 apiKey）
  profile:                  # 统一用户画像：结构化、带证据、可纠错、会演进的跨会话用户模型
    enable: true            # 总开关（关则不注入且不采集；#清空所有记录 会一并清除）
    maxChars: 600           # 注入 system 动态块的字符上限
    maxPerFacet: 8          # 每分面（身份/偏好/沟通风格…）最多保留条数，低置信先淘汰
    infer: true             # 从消息统计隐式推断沟通风格（长度/表情/提问率/活跃时段，标"（推断）"）
    inferAfter: 8           # 累计消息数达到此值后才开始隐式推断（防样本不足误判）
  kb:
    enable: true            # 知识库总开关（关则不注册 kb_search、不入库）
    crawlEnable: true       # 网页抓取开关（web_crawl 工具 + URL 入库/刷新；关则不注册 web_crawl）
    crawl:
      engine: crawl4ai      # 网页抓取引擎：crawl4ai（默认。真浏览器渲染，SPA/JS 动态页可抓；
                            # 需先跑 scripts/install-crawl4ai.sh，未安装自动降级 fetch）| fetch（纯 HTTP+cheerio，零依赖）
    crawlTimeout: 60        # 单页抓取超时秒（慢站可调大；crawl4ai 含浏览器启停另加 30s 余量）
    chunkSize: 500          # 文档分块字符数
    chunkOverlap: 50        # 分块重叠（保上下文连贯）
    topK: 5                 # kb_search 默认返回片段数
    minScore: 0.3           # 最低相似度（cosine；低于不返回）；embedding 复用上面的 recall.embedProvider
  schedule:
    taskEnabled: true       # 定时任务链总开关（#定时任务 cron 重复 task；false 则拒绝创建）
    taskMaxTurns: 15        # 任务链工具调用轮次上限（防失控烧 token）
  selfReview:
    enable: true            # 在线自进化：每 N 轮对话后台异步自我评审，产出改进 suggestion（不阻塞回复）
    every: 20               # 每 N 轮对话触发一次后台自评审（per-scope 计数）
    model: ""               # 评审用模型 id（留空=utilityModel→主模型；建议用廉价小模型降本；可跨厂商）
    autoApplyMemory: true   # 记忆类 suggestion 自动应用（有 prev[] 回滚 + 威胁扫描 + 置信度闸兜底）
    autoApplyPrompt: false  # prompt/技能类落盘待审（#审阅进化 人工把关；强烈建议保持 false）
    dailyBudgetTokens: 200000  # 自评审日 token 预算（耗尽则只采迹不评审，防成本失控）
  evolution:
    traceDir: "data/evolution/traces"           # 对话轨迹存储（供离线 GEPA + 在线自评审消费）
    promptDir: "data/evolution/prompts"         # 进化产出的 prompt 覆盖（加载时覆盖内置 TEMPLATES）
    suggestionDir: "data/evolution/suggestions"  # 自评审 suggestion 落盘（按 scope 隔离）
  toolEvo:                                       # Tool Evolution（工具进化）：可验证/可回滚/权限不可自扩的工具生命周期
    enable: true                                  # 总开关（关闭则不初始化 DB、不埋点、不注入进化工具）
    dbPath: "data/evolution/tevo.db"              # sqlite 库（工具/版本/调用/审计）
    artifactsDir: "data/evolution/tools"          # 工具制品（TOOL.md/index.js/manifest.json/tests.json）
    maxRepairAttempts: 2                          # 候选生成失败自动修复上限（文档 §13）
    runnerTimeoutMs: 5000                         # stable 工具单次调用超时（本地 fork 档与沙箱档共用）
  systemPrompt:
  chatPermission: master
  masterSkipConfirm: false   # 主人发起的任务免确认直执行（高危！仅主人；denylist 仍拦）。开启后主人命令不再 #确认，但会发高危提示
  masters: []
  confirmTimeout: 300
  guardAction: flag
  guardSensitivity: medium
  untrustedGuard: true         # 间接注入防御：工具结果/网页/MCP/记忆/情境等外部内容命中注入特征时加 <untrusted_data> 边界标注（默认开）
  redactSecrets: true          # 发送前脱敏：屏蔽回复中的 API Key/token 等敏感信息（默认开）
  devLog:
    enable: true             # 生产环境默认开：记录 AI 全链路(缩进 JSON 人工可读)，方便 #上报错误 排查
    dir: ""                  # 日志目录(留空=默认 <插件>/data/logs)
  policy:
    categoryMin:
  media:
    enable: true
    active: true
    passive: true
    maxImages: 4
    maxFileBytes: 8388608
    degrade: note
    caps:
  vision:
    enable: true
    model: ""
    protocol:
    preset:
    baseURL: ""
    apiKey: ""
    maxTokens: 1024
    describePrompt: ""
  tools:
    builtin: true
    dir: "tools"
  toolDiscovery:
    enable: true              # 工具按需发现（默认开）：LLM 只常驻少数核心工具，其余经 tool_search 检索后动态注入。关则回退全量常驻
    method: llm               # 工具选择方法：llm=主 LLM 经 tool_search 自主发现（默认）/ jev=由 Jev 从全量工具目录选择（需开启 Jev）
    alwaysOn:                 # 常驻核心工具（不经过搜索，始终在下发 tools 数组）；留空用内置默认
      - tool_search
      - clarify
      - memory_search
      - web_search
      - skill
      - get_chat_history
      - diagram_render
      - spawn_subagent
      - check_subagent
      - extend_subagent
      - get_group_file
      - list_group_files
    topK: 8                   # tool_search 默认返回数
    minScore: 0.3             # 最低相似度（query 覆盖率/cosine；0.3=至少 30% 命中，平衡召回与精度）
  miyoushe:
    cookie: ""
    defaultGid: 2
    maxImages: 9              # miyoushe_post 单帖最多主动发图数（攻略图集帖，避免只发一张；默认 9）
  pixiv:
    enable: false            # Pixiv 功能总开关（需 refreshToken）
    refreshToken: ""         # Pixiv refresh token（用 gppt / pxrepo 等获取；填后 #agents重载）
    imageProxy: "https://i.yuki.sh"   # 图片代理：替换 i.pximg.net（QQ 无 Referer 直连 pximg 显示不了）
    apiProxy: ""             # 可选：app-api 反代地址（留空=直连 app-api.pixiv.net；国内被墙时填反代）
    maxImages: 4             # pixiv_illust 单次最多发图数
  comfyui:
    enable: false             # ComfyUI 工具总开关（关则不注册 comfyui__* 工具，零影响）
    host: "http://127.0.0.1:8188"   # ComfyUI 服务地址（本地/远程/Cloud）；本地默认 8188
    cloud: false              # true=走 Comfy Cloud 路由（host 填 https://cloud.comfy.org，端点加 /api 前缀、/history→/history_v2、/view 跟 302）
    apiKey: ""                # Cloud 的 X-API-Key（cloud:true 时必填；本地通常留空，反向代理加鉴权时填）
    timeout: 300              # 单次生成最长等待秒（视频模板自动放宽到 900）
    pollInterval: 1.5         # 轮询初始间隔（秒，指数退避到 pollMaxInterval）
    pollMaxInterval: 8        # 轮询最大间隔（秒）
    maxImages: 4              # 单次最多发图数（防爆刷）
    outputDir: ""             # 产物落盘目录（留空=插件 data/temp；视频/调试用）
  skill:
    dir: "skills"
    historyCount: 15
  search:
    tavily:
      apiKey: ""
    exa:
      apiKey: ""
    perplexity:
      apiKey: ""
    brave:
      apiKey: ""
    searxng:
      url: ""
    ddg: true
  research:
    permission: master
    maxRounds: 3
    maxConcurrent: 3
    workerModel: ""             # 深度研究 worker 模型：空=主模型；可跨厂商（填模型条目 id 或模型名）
    evaluation: true
  mcp:
    requestTimeout: 60000
    servers:
  sticker:
    enable: false            # 表情包总开关（未开 → 不注入清单、不解析，零影响）
    maxPerReply: 2           # 单条回复最多贴纸数
    cooldown: 300            # 同会话两次带图回复最小间隔（秒）
    sendRate: 0.25           # 概率闸：门控通过后实际带图概率（防每条都带→更 AI）
    antiConsecutive: true    # 防连发：上一条带过则本条不带
    groupOnly: false         # 仅群聊启用
    listTopN: 30             # prompt 注入清单条数上限
    # ── 资源来源：仅自动发现（被动采集群内 image 段 → 视觉判定+打标 → 入库）──
    autoDiscover: false      # 自动发现总开关（需 sticker.enable + agent.vision.model）
    discoverGroups: []       # 采集群白名单（群号字符串；空数组=所有群都采集）
    maxDiscovered: 200       # 自动发现条目上限（超限按 usageCount 升序淘汰冷门）
    discoverMaxSizeMB: 5     # 单张采集大小上限 MB（0=不限）
    sendStickerTool: true    # 注册 send_sticker 工具：按情绪跨全库选图（不受清单 top-N 限制）
  calc:
    enable: true            # Python 精确计算工具（数学/统计/大数等，沙箱执行，避免模型心算出错）
    python: "python3"       # python 可执行文件（容器内路径不同可改，如 /usr/sbin/python3）
    timeout: 10             # 单次计算超时（秒，防死循环）
  diagram:
    # 示意图生成（diagram_render 工具）：LLM 提交语义 DiagramSpec → 确定性 D2 编译 → 自托管 Kroki 渲染
    # → SVG 安全检查 → resvg 高清 PNG → 随回复发送。默认禁用公共 Kroki（用户内容不得外发第三方）。
    # 部署见 docs/deploy/kroki-compose.yaml；未部署 Kroki 时工具返回结构化失败，不影响对话。
    enable: true
    renderer: kroki                  # kroki（自托管容器渲染 D2，推荐）
    fallbackRenderer: none           # Kroki 失败时的本地回退：none | beautiful-mermaid（零 DOM 本地渲染，需已装依赖）
    defaultTheme: paper-blue         # paper-blue | soft-pastel | technical | midnight | sketch（sketch 仅 D2）
    defaultFormat: png               # png | svg（svg 以可编辑源文件发送）
    timeoutMs: 15000                 # 单次渲染总预算（编译+HTTP+栅格化）
    targetWidth: 1600                # 默认输出宽度（px，2x 清晰度）
    maxNodes: 50                     # spec 数量上限（节点/连线/分组/参与者/消息各自独立上限）
    maxEdges: 100
    maxWidth: 2000                   # 输出尺寸钳制
    maxHeight: 5000
    maxPixels: 10000000
    maxOutputBytes: 8388608          # 单图字节上限（超限自动降采样，仍超则 output_too_large）
    tempTtlMinutes: 30               # data/diagram/ 临时文件保留时长（定时清理只删本目录 dg-* 文件）
    kroki:
      enabled: true
      endpoint: "http://127.0.0.1:8000"  # 自托管 Kroki 地址（docker service 名/127.0.0.1/内网 IP）
      allowPublicEndpoint: false     # ⚠️ true=允许 kroki.io 公共服务（图中文字将发往第三方）；且强制 HTTPS
      allowedDiagramTypes:           # Kroki 图类型白名单（模型不可指定；新增类型需配套确定性编译器+安全测试）
        - d2
      connectTimeoutMs: 2000         # 连接/响应头超时
      requestTimeoutMs: 12000        # 单请求总超时（覆盖响应体读取全程）
      maxSourceBytes: 131072         # 编译后 DSL 大小上限
      maxResponseBytes: 4194304      # SVG 响应上限（流式字节计数）
      maxConcurrency: 2              # 渲染并发上限
      circuitBreaker:                # 连续失败熔断（防止 Kroki 宕机时每次调用都等满超时）
        enabled: true
        failureThreshold: 3
        cooldownMs: 30000
      d2:
        layout: elk                  # dagre | elk（sequence 用固定 dagre，复杂分组/ER 用 elk）
      imageTag: ""                   # 部署的 Kroki 镜像版本声明（进缓存 key；升级镜像后必须更新使旧缓存失效）
  document:
    soffice: "soffice"      # LibreOffice 可执行名/路径（file_to_pdf 转任意文件；容器装 libreoffice 后填，如 /usr/bin/soffice）
  stt:
    enable: true            # transcribe_media 工具开关（需填 apiKey 才可用；关则不注册）
    apiBase: ""             # Whisper 兼容 STT API 地址（如 https://api.openai.com/v1/audio/transcriptions）
    apiKey: ""              # STT API Key（OpenAI/Groq/Azure 等）
    model: "whisper-1"     # 模型名
    language: ""            # 语言提示（如 zh/en，留空自动检测）
  sandbox:                # E2B Firecracker 沙箱：terminal 工具的唯一执行面 + toolEvo 的隔离面
    # 命令在独立 microVM 内执行，宿主**不再有任何 shell 执行面**（旧 agent.terminal 已废弃，可直接删除）。
    # 仅 terminal 主人可用（验证码认领：#agents设置主人 → 控制台打印验证码 → 直接把码发到会话）；
    # 沙箱化后不再有 #确认 审批与命令黑名单。
    # mode: off 时 terminal 工具不注册（toolEvo 退回本地 fork 档）；连不上 E2B 一律拒绝执行，绝不回退本地。
    mode: off            # off | e2b
    apiKey: ""           # E2B 云或自托管团队 key（★敏感：已接入 redactSecrets 脱敏）
    apiUrl: ""           # 自托管控制面，如 http://192.168.1.10:3000；留空=云默认 api.{domain}
    domain: ""           # 自托管沙箱域名（{port}-{sandboxID}.{domain}）；留空=云默认 e2b.app
    sandboxUrl: ""       # 自托管无通配 DNS 时填 client-proxy 地址（SDK 自动附路由头）；留空=默认
    template: base       # 沙箱模板（CPU/内存/预装依赖由模板承载；插件侧只加硬超时与网络白名单）
    maxTimeout: 600      # 单命令超时上限（秒）
    defaultCwd: /home/user  # 沙箱内默认工作目录（宿主路径在沙箱内无意义）
    idleMs: 300000       # 闲置回收：会话沙箱空闲超时（毫秒）
    sandboxTtlMs: 600000 # 沙箱 TTL（毫秒）；命中租约且过半衰时自动续期
    maxSandboxes: 4      # 全局并发沙箱上限（超出进入等待队列）
    concurrencyWaitMs: 15000  # 等并发名额的最长时间（毫秒），超时按配额失败
    maxCommandsPerSession: 50 # 单会话命令数上限（防长任务把配额/账单打爆；0=不限）
    requestTimeoutMs: 60000   # SDK 单请求超时
    retries: 1           # SDK 重试次数（云默认 3，降为 1 控延迟）
    allowPublicTraffic: false # 沙箱公开 URL 也要求 token（默认收紧）
    network:
      allowInternet: false    # false=默认拒绝全部出口（allowOut 白名单仍放行）
      denyOut: ["0.0.0.0/0"]  # 兜底拒绝（E2B 语义：allowOut 恒优先于 denyOut）
      allowOut:               # 出口白名单：默认只放行包管理器 + OpenAI API（按需增删）
        - pypi.org
        - "*.pypi.org"
        - files.pythonhosted.org
        - registry.npmjs.org
        - "*.npmjs.org"
        - archive.ubuntu.com
        - security.ubuntu.com
        - ports.ubuntu.com
        - deb.debian.org
        - security.debian.org
        - api.openai.com
    audit: true          # 每条命令写审计日志（会话键/退出码/命令前 200 字符，不含密钥）
    toolEvoVerifyTimeoutMs: 5000  # toolEvo 候选行为验证：单用例超时（沙箱模式）
  stagehand:
    # Stagehand 浏览器自动化（act/extract/observe 自然语言原语，LLM 把指令映射到页面元素）。
    # permission=all：全部成员可用 goto/observe/extract，act 写动作仍需主人 #确认；=master：仅主人。
    # 安全：goto 强制拒绝内网/环回/元数据地址（防 SSRF），并按会员限流；本地浏览器跑在宿主进程，非沙箱。
    # 会话 per-scopeUserId 隔离 + idle 自动关 + 全局会话上限。
    # 依赖 @browserbasehq/stagehand + zod（云崽根 pnpm install 随 workspace 装入插件）；本地模式另需 chromium+系统库。
    enable: false
    permission: all        # all（全部成员）| master（仅主人）
    mode: local            # local（本地 Playwright+chromium，默认）| cloud（Browserbase 云浏览器）
    headless: true         # 本地模式是否无头
    stealth: true          # 真机化：随机设备指纹(UA/视口/语言/触屏)+去自动化 flag+规避脚本，降低被风控拦截概率
    userAgent: ""          # 指定固定 UA（留空=按设备指纹池随机）
    executablePath: ""     # 本地 chrome 可执行路径（空=Stagehand 自定/CHROME_PATH；可填复用已装 chrome）
    browserbaseApiKey: ""  # 云模式必填（bb_live_...）
    region: ""             # 云模式可选：us-west-2(默认)/us-east-1/eu-central-1/ap-southeast-1
    modelName: ""          # Stagehand 原生模型（如 google/gemini-2.5-flash；空=复用插件 provider，仅 OpenAI 兼容；云模式空=Model Gateway 自动选）
    modelApiKey: ""        # 原生模型 apiKey（云模式部分 provider 可空）
    idleTimeoutMs: 300000  # 会话空闲多久自动关（默认 5 分钟）
    maxSessions: 3         # 全局并发浏览器会话上限
    maxCallsPerMinute: 10  # 每会员每分钟浏览器操作上限
    maxCallsPerDay: 200    # 每会员每日浏览器操作上限
    blockedHosts: []       # 额外禁访主机（在默认内网/元数据黑名单之外）
    domSettleTimeoutMs: 3000  # act 前 DOM 稳定等待（毫秒）
  download:
    # 媒体下载工具（yt-dlp；仅框架主人，受约束）。下载视频/音频时 LLM 优先用 web_download，不走 terminal 裸 shell。
    # 依赖系统 yt-dlp + ffmpeg（合并格式）。默认开。
    enable: true
    maxMB: 600              # 单文件大小上限（yt-dlp --max-filesize，超限中止）
    sendLimitMB: 100        # 超过此大小不自动发 QQ（返回本地路径，供 SFTP 取）
    maxTimeoutSec: 600      # 单次下载超时上限（秒）
    bin: ""                 # yt-dlp 可执行路径（空=PATH 中的 yt-dlp）
    dir: ""                 # 输出目录（空=插件 data/temp/downloads）
  multiagent:
    # 子代理编排：主 Agent 可自主创建子代理委派任务。LLM 自己判断何时需要拆分。
    # 子代理是隔离 Agent（看不到主对话历史），只做被委派的任务，返回结果文本。
    # 安全：子代理只能用 query 类工具（搜索/记忆/计算），群管/系统/终端不可；不会递归创建子代理。
    enable: true
    topology: spawn             # spawn=异步三件套 spawn/check/extend_subagent（默认）| orchestrator=同步编排工具 orchestrate
    maxConcurrent: 3            # 同时运行的子代理数上限
    maxSpawnsPerConversation: 5 # 单次对话最多创建几个子代理（topology=spawn 时生效）
    workerMaxTurns: 10          # 子代理工具循环上限（防失控烧 token）
    workerModel: ""             # 子代理模型（空=复用主模型；可跨厂商，填便宜模型可降本）
    defaultTools:               # 子代理默认可用工具（模型未指定时）
      - web_search
      - memory_search
  webApi:
    enable: true           # Web 管理面板（独立 HTTP 服务，脱离锅巴）：主人私聊发 #agents登录 取得带 token 的访问地址（24h 有效）
    port: 6098             # 监听端口（0.0.0.0）；默认避开 Yunzai 2536 / 锅巴 6099
    publicUrl: ""          # 对外访问地址（留空自动探测本机 LAN IP；填 http://1.2.3.4:6098 覆盖）
  # ─────────────── 伪人模式（群聊环境参与者）───────────────
  # 在现有任务型 Agent 旁新增一条「持续旁听→低成本门控→工具化决策→独立表达→可中断发送」的流水线。
  # 红线：环境模式普通 assistant 文本永不发送；只有 human_reply/human_react 才产生对外消息。
  # 默认全关 + shadow（只记录决策不实发）；需显式白名单 groups 才生效。详见 trss-agent-plugin-humanlike-mode-development-guide-v1.0.md
  humanize:
    # ⚠️ 伪人模式为早期开发，很不稳定，默认关闭。开启前请仔细阅读 model/humanize/ 源码。
    # 已知问题：评分粗糙（纯关键词）、无效果追踪、无表达学习、Planner 可能抢答/重复。
    # 建议：shadow=true 观察 #伪人决策 质量后再放量。
    enable: false                  # 总开关（即便 true，groups 为空也不开启）
    groups: []                     # 显式白名单群号（字符串）；空数组=不开启
    shadow: true                   # true=只记录决策 trace、不真实发送（先观察再放量）
    talkValue: 0.35                # 0~1 主动性基线（不等于回复概率）
    debounceMs: 1200               # 消息安静窗口（ms）：burst 后等此窗口再评估
    plannerTimeoutMs: 30000        # 单轮 Planner 超时（ms）；超时默认沉默
    maxPlannerRounds: 4            # Planner 内部工具循环最大轮数
    contextMessages: 30            # 注入 Prompt 的最近消息条数（存储 150，注入 30）
    threshold: 80                  # 必要性评分阈值（final>=80 才进 Planner）
    cooldownSeconds: 45            # 成功回复后冷却（秒）
    presenceWindowSeconds: 300     # 在场占比统计窗口（秒，默认 5 分钟）
    maxRepliesPer10Minutes: 4      # 10 分钟内最大回复数（频率硬上限）
    bufferCapacity: 150            # 单群消息缓冲条数
    bufferTtlHours: 2              # 缓冲 TTL（小时）
    knownBots: []                   # 已知其它 bot 账号（QQ号，如林墨的bot）：互相连续对线3轮且无真人 → 熔断10分钟
    memory:                        # 伪人独立记忆库（独立 sqlite：data/humanize/memory.db；与主 Agent 记忆完全隔离）
      enabled: true                # 每日 04:47 睡眠整合近期对话→长时记忆；Planner/Replyer 按相关性检索注入
      maxPerQuery: 5               # Planner 单次注入条数
      maxPerGroup: 300             # 单群容量（超量按重要性×使用率淘汰）
      incrementalMinMessages: 20   # 每小时增量整合水位（新增≥N条才跑——梗当天入库，不用等次日）
      forgetDays: 30               # 超龄硬遗忘（天）
    idleBackoffBaseSeconds: 15     # 连续无动作退避基数（15/30/60/120/240…）
    idleBackoffCapSeconds: 300     # 退避上限
    idleBackoffStartCount: 2       # 第几次无动作起开始退避
    bypassPendingCount: 6          # 待处理新消息达此数绕过退避
    personaName: ""                # 机器人在群里的名字（留空=用 Bot.nickname）
    botId: ""                      # 机器人自身 QQ（留空=自动探测 Bot.uin）
    persona:                       # 群聊角色人设（MaiBot 式，与主 Agent 人设独立）
      name: ""                     # 角色名（留空=用 personaName）
      prompt: ""                   # 角色卡正文（自由多段，最高优先级）。示例见下方注释
      fromPersonaId: ""            # prompt 为空时，按 id/名复用 PersonaStore 人设（如 raiden-ei）
      # prompt 示例（MaiBot 式角色卡，取消注释按需改）：
      # prompt: |
      #   你是「小汐」，群里一个爱聊天的技术宅。性格随和有点皮，喜欢接梗。
      #   【语气】轻松口语，偶尔用「哈」「确实」这类语气词，不端着。
      #   【口癖】赞同别人时爱说「确实是」；遇到有意思的会回「有点东西」。
      #   【距离感】对熟络的群友随意，对新人礼貌但不冷场。
      #   【偏好】对 AI/编程/数码话题兴致高；八卦闲聊也会接，但不主动挑起。
      #   【不做】不发长篇大论、不列要点清单、不每次都称呼对方。
    planner:
      model: ""                    # Planner 模型 id（留空=utilityModel→主模型；可跨厂商）
      temperature: 0.2
      maxTokens: 800
      allowedReadTools: []         # Planner 可用的只读工具白名单；写/删/管理/终端/发送类一律拒绝
    replyer:
      model: ""                    # Replyer 模型 id（留空=主模型）
      temperature: 0.7
      maxTokens: 500
      maxChars: 500                # 超长则低温重写
    reply:
      maxBubbles: 3                # 单次回复最多气泡数
      typingSpeed: 1.0             # 输入延迟倍率（越大越快）
      minDelayMs: 600
      maxDelayMs: 3500
      typos: false                 # 自动错字（第一版强制 false）
      allowSticker: true           # 允许尾随表情包（复用 sticker cooldown/sendRate）
    behaviorPolicy:                # 「何时参与」（与「怎么说」的人设分离）
      topics: []                   # 关注主题（命中 +10~25）
      avoidTopics: []              # 回避主题
      initiative: 0.35
      humor: 0.4
      answerUnknownQuestions: false
      interruptHumanConversation: false
      maxRepliesPer10Minutes: 4
    safety:
      privateMemoryInGroup: false  # 隐私红线（强制 false，不可改）
      maxConcurrentGroups: 1       # 同时 Planning 的群数上限

  # ───────────────── 群聊小世界 GroupWorld（社会记忆层） ─────────────────
  # 按群隔离、持续更新、带证据/会遗忘/可局部检索的稀疏社会关系网络。设计文档：trss-agent-plugin-groupworld-design-v1.0.md
  # 数据落 sqlite（data/groupworld/gw.db）。online 默认 false：先观察画像质量，翻 true 才注入 Planner/Replyer。
  # 语义层（embedding 检索相似度/近义合并/事件语义去重）复用 recall 的 embedding 配置
  # （agent.recall.embedProvider / embedBaseURL / embedApiKey）；未配置则全部走词面相似度，功能不受阻。
  groupWorld:
    enabled: false                 # 总开关（即便 true，groups 为空也不开启）
    groups: []                     # 显式白名单群号；空数组=不开启
    online: false                  # 在线影响 Planner/Replyer（默认关：先观察再上线）

    ingestion:
      rawMessageRetentionDays: 30  # 原始消息保留天数（超过由每日维护清理）
      segmentIdleSeconds: 300      # 会话切片静默阈值（文档 3~8min，默认 5min）
      segmentMaxMessages: 100      # 单片段最大消息数（文档 60~120）
      ignoreCommandMessages: true  # #指令消息不摄入
      topicShiftEnabled: true      # 主题漂移切分（TextTiling 式；换话题无静默间隙也提前分割）
      topicShiftWindow: 6          # 参与漂移比较的近窗有效消息数
      topicShiftSimThreshold: 0.06 # 新消息与近窗相似度低于此值 → 分割（保守防碎片化）

    analysis:
      schedule: "7 * * * *"        # 小时增量分析 cron（每小时 :07）
      minSegmentMessages: 4        # 有效信息量低于此值的片段跳过分析
      maxSegmentsPerRun: 50        # 每轮最多分析片段数
      modelProfile: ""             # 分析模型 id（留空=主模型/utilityModel；可跨厂商）
      maxDailyCallsPerGroup: 100   # 每群每日 LLM 调用预算（熔断）
      retryCount: 1                # 模型非法 JSON 重试次数（仍失败→dead_letter）
      maxTokens: 1200
      episodeMergeSim: 0.85        # 事件语义去重阈值（embedding 余弦；需配 recall.embedProvider）

    profiles:
      hotActiveDays30d: 10         # 近30天活跃天数≥此值=hot（维护完整画像）
      warmMessageCount30d: 5       # 近30天发言数≥此值=warm
      minOnlineConfidence: 0.55    # 在线上下文最低置信（不可低于0.55；低置信推断不进回复）
      maxTraitsPerUser: 5          # 每成员在线返回画像上限
      traitMergeSimThreshold: 0.82 # 近义特征聚类合并阈值（每日维护；embedding 余弦）

    graph:
      activeEdgeDays: 90           # 关系边活跃窗口
      maxNeighborsPerUser: 40      # 每成员活跃一跳关系上限
      weeklyCommunityDetection: true  # 每周小圈子识别
      minCommunitySize: 3          # 最小圈子人数

    retrieval:
      plannerTokenBudget: 800      # Planner 社会现场 token 预算
      replyerTokenBudget: 500      # Replyer 社会现场 token 预算
      maxEpisodes: 3               # 在线返回共同经历上限
      maxRelationships: 5          # 在线返回关系上限
      cacheTtlSeconds: 60          # 社会现场短 TTL 缓存

    privacy:
      allowUserOptOut: true        # 允许 #关闭我的群聊建模
      allowUserInspect: true       # 允许 #查看我的群聊画像
      allowUserCorrect: true       # 允许 #纠正我的群聊画像
      blockSensitiveInference: true  # 拦截敏感推断（健康/政治/性取向/证件等）

  # ───────────────── SelfState 自我认知与情绪（GroupWorld 配套层，Phase 0-4） ─────────────────
  # 设计文档：trss-agent-plugin-groupworld-selfstate-design-v1.1.md
  # 红线：情绪只是偏置（不覆盖权限/安全/功能指令/工具结果）；不外显数值；跨群隔离；
  #      禁卖惨/跨用户扩散/功能报复；负状态超时恢复。数据与 GroupWorld 同库（data/groupworld/gw.db，ss_ 前缀表）。
  selfState:
    enabled: false              # 总开关（关=整层 no-op）
    shadowMode: true            # 计算入库但不影响发言（观察期）；false 才注入 Planner/Replyer

    scope:
      isolateByGroup: true      # 群级隔离（唯一模式）

    eventDetection:
      semantic: true                     # 语义近邻检测层（需 agent.recall.embedProvider 配 embedding 模型；未配自动回落关键词）
      ambiguousIntentModelProfile: ""   # 歧义评价模型（留空=主模型）
      minEventConfidence: 0.55

    emotion:
      maxNormalImpulse: 0.20        # 普通事件单次脉冲上限
      maxHighSalienceImpulse: 0.35  # 高置信公开重复攻击上限
      minVisibleIntensity: 0.18     # 低于此强度不进投影
      maxActiveEmotions: 8
      enableMixedEmotions: true     # 允许多情绪并存（不压成单标签）
      lazyDecay: true               # 懒衰减（读时算，无定时扫描）
      moodEmaAlpha: 0.3             # 心境 EMA 惯性系数（0=冻结 1=无惯性；被骂后低落持续而非半小时反弹）
      moodResetHours: 6             # 超时无迁移自动回基线（睡一觉恢复）

    resentment:
      enabled: true
      minCreateConfidence: 0.72
      maxSingleEventDelta: 0.05     # 单次怨气增量上限
      halfLifeDays: 7

    expectations:
      enabled: true
      minimumWindowSeconds: 90      # 动态等待窗下限
      maximumWindowSeconds: 3600
      minIgnoredConfidence: 0.65    # ignore_score 达此值才算高置信冷落
      requireTargetActivityEvidence: true

    reflection:
      enabled: true
      minSignificantEvents: 3
      maxReflectionsPerDay: 10
      defaultTtlDays: 7

    planner:
      includeStateProjection: true
      maxStateTokens: 220
      emotionIsBiasOnly: true       # 强制 true（红线）

    replyer:
      includeExpressionCapsule: true
      exposeNumericState: false     # 强制 false（红线：不外显数值）
      allowNaturalEmotionDisclosure: true

    stability:
      noCrossUserSpillover: true    # 强制 true（红线）
      preventEmotionalBlackmail: true  # 强制 true（红线）
      preventSelfHarmNarratives: true  # 强制 true（红线）
      maxNegativeMoodHours: 24      # 负心境超时 → 恢复流程

    retention:
      transitionLogDays: 14
      resolvedEmotionDays: 7
      resolvedExpectationDays: 7

