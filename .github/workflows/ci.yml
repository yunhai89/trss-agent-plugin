name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: 离线测试 (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']  # pnpm@11 需 Node 22.13+（Node 20 已被 GitHub Actions 弃用且不兼容 pnpm 11）
    steps:
      - uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: 安装依赖（frozen lockfile）
        run: pnpm install --frozen-lockfile
      - name: 跑全量离线测试
        run: pnpm test
      - name: ESLint（非阻塞，存量 warn）
        run: pnpm run lint
        continue-on-error: true
